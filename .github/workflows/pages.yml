name: Check and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Reports are not kept in the repository: no screenshot folders, no big files (CLAUDE.md, «Отчёты»).
      - run: node scripts/check-size.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run sim:check
      # The address of the game server for the site on GitHub Pages (DEPLOY.md): the repository variable
      # VITE_SERVER_URL, e.g. wss://bortom.duckdns.org. Empty — the site asks for the address in «По сети».
      - run: npm run build
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - run: npm run build:server
      # The print-and-play set (docs/tasks/print-kit.md): PDFs as the artifact print-kit and on the site in dist/print/.
      # A failure here fails a pull request's check, but does not hold back the deployment of the site from main.
      - uses: actions/cache@v4
        with:
          path: out/print/cache
          key: print-cache-${{ hashFiles('tools/card-art/**', 'tools/print/**', 'data/game-data.json', 'src/ui/game/art/**') }}
          restore-keys: print-cache-
      - name: Print kit
        id: print
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils
          npm run print -- --check --check-pdf
          npx vite-node tools/print/check-text.ts
          mkdir -p dist/print
          cp out/print/*.pdf out/print/index.html dist/print/
          cp -r out/print/obrazcy dist/print/
          ls -la dist/print dist/print/obrazcy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: print-kit
          path: |
            out/print/*.pdf
            out/print/obrazcy/
          compression-level: 0
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  # Browser test: bots play a match through the interface, people play to the end, the table fits the window.
  # The deployment does not wait for it.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
        env:
          E2E_WEBKIT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-shots
          if-no-files-found: ignore

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
