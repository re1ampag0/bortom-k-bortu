<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настройки — телефон</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,400;1,500&amp;family=Alegreya+SC:wght@500;700;800&amp;family=Alegreya+Sans:wght@400;500;700&amp;family=Old+Standard+TT:wght@400;700&amp;display=swap">
<style>
body{margin:0}
.sc{font-family:'Alegreya SC',Georgia,serif}
.chart{background-color:#0e1b26;background-image:linear-gradient(rgba(127,180,200,.07) 1px,rgba(0,0,0,0) 1px),linear-gradient(90deg,rgba(127,180,200,.07) 1px,rgba(0,0,0,0) 1px);background-size:44px 44px}
.h2{margin:14px 0 4px;font-family:'Alegreya SC',Georgia,serif;font-weight:800;font-size:16px;color:#f0d27a;display:flex;align-items:center;gap:8px}
.h2::after{content:"";flex:1;height:1px;background:rgba(201,160,72,.4)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:2px 0}
.name{font-size:15px;color:#e8eef2;min-width:0}
.seg{display:flex;flex:none;border:1.5px solid #c9a048;border-radius:8px;overflow:hidden;background:#0b141c}
.seg button{min-height:36px;padding:0 10px;border:0;border-left:1px solid rgba(201,160,72,.5);background:transparent;color:#d8e3e8;font-family:'Alegreya SC',Georgia,serif;font-weight:700;font-size:13px;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:linear-gradient(#5a3a22,#3a2414);color:#f6dd92;box-shadow:inset 0 0 0 1px #c9a048}
.track{position:relative;width:42px;height:24px;flex:none;border-radius:12px;border:1.5px solid #8a6a24;background:#0b141c}
.track i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#9aa6ae,#4a5660)}
.track.on{background:#2c6658;border-color:#c9a048}
.track.on i{left:20px;background:radial-gradient(circle at 40% 35%,#fff3c4,#c9a048)}
.hint{display:block;font-size:12px;line-height:1.25;color:#8fa6b3}
.btn-line{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 10px;border-radius:8px;border:1.5px solid #c9a048;background:rgba(18,29,39,.9);color:#f0d27a;font-family:'Alegreya SC',Georgia,serif;font-weight:700;font-size:14px}
.btn-red{display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 10px;border-radius:8px;border:1.5px solid #e08a6a;background:rgba(142,43,34,.35);color:#ffd8c8;font-family:'Alegreya SC',Georgia,serif;font-weight:700;font-size:14px}
.h2 img{flex:none}
.wheelbtn img{transition:rotate .6s cubic-bezier(.3,.7,.2,1)}.wheelbtn:hover img{rotate:180deg}
.egg{display:inline-flex;align-items:center;gap:6px}.egg img{transition:rotate 1.2s ease}.egg:hover img{rotate:-200deg}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Alegreya Sans', system-ui, sans-serif; color: #eef3f6; background: #234a5e">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(4,8,12,.7)"></div>

  <section role="dialog" aria-label="Настройки" class="chart" style="position: absolute; left: 0; right: 0; top: 44px; bottom: 0; box-sizing: border-box; border-top: 3px solid #c9a048; border-radius: 18px 18px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,.6); display: flex; flex-direction: column; overflow: hidden">
    <div aria-hidden="true" style="flex: none; height: 14px; display: flex; justify-content: center; align-items: center; background: #15212b"><span style="width: 44px; height: 5px; border-radius: 3px; background: #6f8796"></span></div>
    <header style="flex: none; height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; background: linear-gradient(#15212b, #15212b); border-bottom: 2px solid #c9a048">
      <span class="wheelbtn"><img src="../assets/icons/ic_wheel.svg" alt="" width="34" height="34" style="display: block"></span><h1 class="sc" style="margin: 0; flex: 1; font-size: 23px; font-weight: 800; color: #f0d27a">Настройки</h1>
      <button aria-label="Закрыть" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid #c9a048; background: radial-gradient(circle at 40% 32%, #f6dd92, #c9a048 60%, #8a6a24); color: #24180a; font-size: 22px; font-weight: 700; line-height: 1">×</button>
    </header>

    <div style="flex: 1; min-height: 0; overflow: hidden; padding: 0 16px; position: relative">
      <h2 class="h2"><img src="../assets/icons/ic_spyglass.svg" alt="" width="22" height="22">Показ</h2>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 2px 0 6px"><span class="name">Скорость показа ходов</span><span class="seg" role="group" aria-label="Скорость показа ходов" style="align-self: stretch"><button aria-pressed="false" style="flex: 1">Медленно</button><button aria-pressed="true" style="flex: 1">Обычно</button><button aria-pressed="false" style="flex: 1">Быстро</button><button aria-pressed="false" style="flex: 1">Мгновенно</button></span></div>
      <div class="row"><span class="name">Спецэффекты</span><span class="seg" role="group" aria-label="Спецэффекты"><button aria-pressed="true">Богатые</button><button aria-pressed="false">Простые</button></span></div>
      <label class="row"><span class="name">Пропуск показа касанием стола</span><span class="track on"><i></i></span></label>

      <h2 class="h2"><img src="../assets/icons/ic_cutlasses.svg" alt="" width="22" height="22">Игра</h2>
      <label class="row"><span class="name">Звук «ваш ход»</span><span class="track on"><i></i></span></label>
      <label class="row"><span class="name">Быстрый конец хода<span class="hint">«Ход окончен · Отменить» — 1 с вместо 3 с</span></span><span class="track"><i></i></span></label>
      <label class="row"><span class="name">Подсказки<span class="hint">урон на целях, «4 → 2» на Реакциях</span></span><span class="track on"><i></i></span></label>

      <h2 class="h2"><img src="../assets/icons/ic_compass.svg" alt="" width="22" height="22">Вид стола</h2>
      <div class="row"><span class="name">Залп на планшете</span><span class="seg" role="group" aria-label="Залп на планшете"><button aria-pressed="true">Значки</button><button aria-pressed="false">Порты</button></span></div>
      <div class="row"><span class="name">Фон под рукой</span><span class="seg" role="group" aria-label="Фон под рукой"><button aria-pressed="true">Палуба</button><button aria-pressed="false">Стол капитана</button></span></div>
      <div class="row"><span class="name">Рамка моря</span><span class="seg" role="group" aria-label="Рамка моря"><button aria-pressed="true">Фальшборт</button><button aria-pressed="false">Латунь</button></span></div>
      <div class="row"><span class="name">Разбор урона</span><span class="seg" role="group" aria-label="Разбор урона"><button aria-pressed="true">Показывать</button><button aria-pressed="false">Скрыть</button></span></div>
      <span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 28px; background: linear-gradient(rgba(14,27,38,0), #0e1b26)"></span>
    </div>

    <footer style="flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid rgba(201,160,72,.35); background: rgba(10,18,26,.85)">
      <button class="btn-line">Скачать журнал</button>
      <button class="btn-line">Скачать партию</button>
      <button class="btn-red">Сдаться (Пираты)</button>
      <button class="btn-line">Новая партия</button>
      <span style="grid-column: span 2; display: flex; justify-content: center"><span class="egg" title="Этот компас показывает не на север, а туда, куда вам действительно нужно" style="font-size: 11.5px; color: #6f8796"><img src="../assets/icons/ic_compass.svg" alt="" width="16" height="16">Версия 1a2b3c4 · 24.10, 18:40</span></span>
    </footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }

</body>
</html>
