<style>
body{margin:0}
a{color:#e0bd62}a:hover{color:#f0d27a}
.sc{font-family:'Alegreya SC',Georgia,serif}
.chart{background-color:#0e1b26;background-image:linear-gradient(rgba(127,180,200,.07) 1px,rgba(0,0,0,0) 1px),linear-gradient(90deg,rgba(127,180,200,.07) 1px,rgba(0,0,0,0) 1px);background-size:44px 44px}
.waves{background-image:radial-gradient(ellipse 10px 3px at 50% 100%,rgba(0,0,0,0) 62%,rgba(200,218,230,.42) 67%,rgba(0,0,0,0) 77%);background-size:34px 10px}
.tile{position:relative;display:flex;overflow:hidden;border-radius:12px;border:2.5px solid #8a6a24;background:#111c26;color:#eef3f6;text-align:left;cursor:pointer;padding:0;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.tile.on{border-color:#f0d27a;box-shadow:0 0 0 3px rgba(240,210,122,.3),0 0 22px rgba(240,210,122,.3)}
.seg{display:flex;border:2px solid #c9a048;border-radius:10px;overflow:hidden;background:#121d27}
.seg button{flex:1;min-height:44px;padding:0 4px;border:0;border-left:1px solid rgba(201,160,72,.5);background:transparent;color:#e8eef2;font-family:'Alegreya SC',Georgia,serif;font-weight:700;font-size:14px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:linear-gradient(#5a3a22,#3a2414);color:#f6dd92;box-shadow:inset 0 0 0 1px #c9a048}
.sw{display:flex;align-items:center;gap:10px;min-height:40px;font-size:15px;color:#e8eef2}
.track{position:relative;width:42px;height:24px;flex:none;border-radius:12px;border:1.5px solid #8a6a24;background:#0b141c}
.track i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#9aa6ae,#4a5660)}
.track.on{background:#2c6658;border-color:#c9a048}
.track.on i{left:20px;background:radial-gradient(circle at 40% 35%,#fff3c4,#c9a048)}
.btn-gold{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:9px;border:2px solid #5c4615;background:linear-gradient(#f6dd92,#c9a048 55%,#a8822e);color:#24180a;font-family:'Alegreya SC',Georgia,serif;font-weight:800;font-size:19px;letter-spacing:.04em;box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 3px 0 #5c4615}
.label{font-family:'Alegreya SC',Georgia,serif;font-weight:700;font-size:15px;color:#f0d27a;margin:0}
/* motion: transform/opacity only — cheap on phones */
@keyframes bob{0%,100%{translate:0 0;rotate:0deg}50%{translate:0 -3px;rotate:.7deg}}
@keyframes bobR{0%,100%{translate:0 0}50%{translate:0 3px}}
@keyframes driftP{to{transform:translateX(40px)}}
.driftP{animation:driftP 8s linear infinite}
@keyframes driftA{to{transform:translateX(58px)}}
@keyframes driftB{to{transform:translateX(-97px)}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes beam{0%,100%{rotate:-7deg;opacity:.7}50%{rotate:6deg;opacity:1}}
@keyframes bottle{0%,100%{translate:0 0;rotate:0deg}25%{translate:-10px -1.5px;rotate:-6deg}50%{translate:-22px 0;rotate:0deg}75%{translate:-12px 1.5px;rotate:5deg}}
@keyframes gulls{0%,100%{translate:0 0}50%{translate:46px -8px}}
@keyframes clouds{0%,100%{translate:0 0}50%{translate:36px 0}}
@keyframes flicker{0%,100%{opacity:1}40%{opacity:.7}55%{opacity:.95}70%{opacity:.6}}
@keyframes rise{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 3px rgba(240,210,122,.35),0 0 22px rgba(240,210,122,.28),0 8px 20px rgba(0,0,0,.45)}50%{box-shadow:0 0 0 3px rgba(240,210,122,.5),0 0 36px rgba(240,210,122,.45),0 8px 20px rgba(0,0,0,.45)}}
@keyframes coinSpin{0%,62%,100%{scale:1 1}70%{scale:.05 1}78%{scale:1 1}}
.bob{animation:bob 6.4s ease-in-out infinite}
.bob.d1{animation-delay:-1.6s;animation-duration:7.2s}.bob.d2{animation-delay:-3.1s;animation-duration:5.8s}.bob.d3{animation-delay:-4.4s;animation-duration:6.8s}
.bobR{animation:bobR 6.4s ease-in-out infinite}
.bobR.d1{animation-delay:-1.6s;animation-duration:7.2s}.bobR.d2{animation-delay:-3.1s;animation-duration:5.8s}.bobR.d3{animation-delay:-4.4s;animation-duration:6.8s}
.driftA{animation:driftA 9s linear infinite}.driftB{animation:driftB 16s linear infinite}
.tw{animation:twinkle 3.6s ease-in-out infinite}.tw2{animation:twinkle 5.2s ease-in-out -2s infinite}
.shim{animation:shimmer 2.8s ease-in-out infinite}
.beam{transform-origin:1320px 177px;animation:beam 7s ease-in-out infinite}
.bottle{transform-box:fill-box;transform-origin:center;animation:bottle 16s ease-in-out infinite}
.gulls{animation:gulls 22s ease-in-out infinite}.clouds{animation:clouds 48s ease-in-out infinite}
.flick{animation:flicker 2.4s ease-in-out infinite}.flick.d1{animation-delay:-.8s}.flick.d2{animation-delay:-1.5s}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}.rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.16s}.rise.d3{animation-delay:.24s}.rise.d4{animation-delay:.32s}
.lift{transition:translate .25s ease,box-shadow .25s ease,filter .25s ease}.lift:hover{translate:0 -4px;filter:brightness(1.06)}
.lift:hover .medal img,.lift:hover .round img{rotate:-8deg;scale:1.06}
.medal img,.round img{transition:rotate .3s ease,scale .3s ease}
.lift.spin:hover .round img{rotate:90deg;scale:1.06}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
.tile{transition:translate .25s ease,filter .25s ease}
.tile.on{animation:glowPulse 3.2s ease-in-out infinite}
.coin{animation:coinSpin 6s ease-in-out infinite;transform-origin:center}
@keyframes seaGlint{0%,100%{opacity:1}35%{opacity:.55}60%{opacity:.9}80%{opacity:.6}}.seaGlint{animation:seaGlint 3.4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){[class^="seaDrift"],[class^="seaSwell"],.seaGlint{animation:none !important}}@keyframes seaDriftTPPr{to{transform:translateX(150px)}}.seaDriftTPPr{animation:seaDriftTPPr 21s linear infinite}@keyframes seaSwellTPPr{0%{transform:translate(0,0);opacity:.9}50%{transform:translate(-75px,.8px);opacity:.55}100%{transform:translate(-150px,0);opacity:.9}}.seaSwellTPPr{animation:seaSwellTPPr 37s linear infinite}@keyframes seaDriftTCPr{to{transform:translateX(150px)}}.seaDriftTCPr{animation:seaDriftTCPr 21s linear infinite}@keyframes seaSwellTCPr{0%{transform:translate(0,0);opacity:.9}50%{transform:translate(-75px,.8px);opacity:.55}100%{transform:translate(-150px,0);opacity:.9}}.seaSwellTCPr{animation:seaSwellTCPr 37s linear infinite}</style>
