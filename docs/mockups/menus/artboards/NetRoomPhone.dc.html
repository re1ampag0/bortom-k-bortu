<style>
body{margin:0}
a{color:#e0bd62}a:hover{color:#f0d27a}
.sc{font-family:'Alegreya SC',Georgia,serif}
.chart{background-color:#0e1b26;background-image:linear-gradient(rgba(127,180,200,.07) 1px,rgba(0,0,0,0) 1px),linear-gradient(90deg,rgba(127,180,200,.07) 1px,rgba(0,0,0,0) 1px);background-size:44px 44px}
.plaque{position:relative;border:2.5px solid #c9a048;border-radius:12px;box-shadow:inset 0 0 0 1px #5c4615,0 6px 16px rgba(0,0,0,.45);background:radial-gradient(circle at 10px 10px,#f0d27a 0 1.8px,#7a5a1e 2.2px 2.9px,rgba(0,0,0,0) 3.3px),radial-gradient(circle at calc(100% - 10px) 10px,#f0d27a 0 1.8px,#7a5a1e 2.2px 2.9px,rgba(0,0,0,0) 3.3px),radial-gradient(circle at 10px calc(100% - 10px),#f0d27a 0 1.8px,#7a5a1e 2.2px 2.9px,rgba(0,0,0,0) 3.3px),radial-gradient(circle at calc(100% - 10px) calc(100% - 10px),#f0d27a 0 1.8px,#7a5a1e 2.2px 2.9px,rgba(0,0,0,0) 3.3px),linear-gradient(#20303d,#111c26)}
.seat{display:flex;align-items:center;gap:8px;height:64px;box-sizing:border-box;padding:4px 8px 4px 4px;border-radius:10px;background:rgba(10,18,26,.75)}
.seat img.ship{width:78px;height:50px;position:absolute;left:3px;top:-3px;clip-path:inset(0 0 15% 0);filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
.berth{position:relative;flex:none;width:84px;height:52px;border-radius:6px;overflow:hidden;background:linear-gradient(#14263a 0%,#2a4660 76%,#2b4a62 77%,#12283a 100%);box-shadow:inset 0 0 0 1px rgba(201,160,72,.35)}
.lamp{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.lamp.on{background:radial-gradient(circle at 35% 30%,#d8ffe8,#5fc89a 60%,#2a7a56);box-shadow:0 0 7px #5fc89a}
.lamp.off{background:radial-gradient(circle at 35% 30%,#b8c4cc,#56646e 70%)}
.who{font-size:14px;color:#e8eef2}
.sbtn{min-height:40px;padding:0 11px;border-radius:8px;border:1.5px solid #c9a048;background:rgba(18,29,39,.9);color:#f0d27a;font-family:'Alegreya SC',Georgia,serif;font-weight:700;font-size:14px}
.btn-gold{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:9px;border:2px solid #5c4615;background:linear-gradient(#f6dd92,#c9a048 55%,#a8822e);color:#24180a;font-family:'Alegreya SC',Georgia,serif;font-weight:800;font-size:19px;letter-spacing:.04em;box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 3px 0 #5c4615}
.label{font-family:'Alegreya SC',Georgia,serif;font-weight:700;font-size:14px;margin:0}
@keyframes seaGlint{0%,100%{opacity:1}35%{opacity:.55}60%{opacity:.9}80%{opacity:.6}}.seaGlint{animation:seaGlint 3.4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){[class^="seaDrift"],[class^="seaSwell"],.seaGlint{animation:none !important}}
.chart:not(.doc){background:#0e1b26 url(../assets/bg/chart-phone.svg) center/cover no-repeat!important}

/* ships sit in the water, not on it */
.seat img.ship{top:0!important;filter:none!important}.berth rect[fill^="url(#sh"]{display:none}.berth::after{content:"";position:absolute;left:12px;right:12px;top:39px;height:6px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.5),rgba(0,0,0,0));z-index:2}

.seat{height:66px;padding:7px 8px 7px 7px}
