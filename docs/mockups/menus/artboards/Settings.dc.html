<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настройки</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,400;1,500&amp;family=Alegreya+SC:wght@500;700;800&amp;family=Alegreya+Sans:wght@400;500;700&amp;family=Old+Standard+TT:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#e0bd62}a:hover{color:#f0d27a}
.sc{font-family:'Alegreya SC',Georgia,serif}
.chart{background-color:#0e1b26;background-image:linear-gradient(rgba(127,180,200,.07) 1px,rgba(0,0,0,0) 1px),linear-gradient(90deg,rgba(127,180,200,.07) 1px,rgba(0,0,0,0) 1px);background-size:48px 48px}
.h2{margin:0 0 10px;font-family:'Alegreya SC',Georgia,serif;font-weight:800;font-size:17px;color:#f0d27a;display:flex;align-items:center;gap:8px}
.h2::after{content:"";flex:1;height:1px;background:rgba(201,160,72,.4)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:3px 0}
.name{font-size:15.5px;color:#e8eef2}
.seg{display:flex;flex:none;border:1.5px solid #c9a048;border-radius:8px;overflow:hidden;background:#0b141c}
.seg button{min-height:36px;padding:0 12px;border:0;border-left:1px solid rgba(201,160,72,.5);background:transparent;color:#d8e3e8;font-family:'Alegreya SC',Georgia,serif;font-weight:700;font-size:14px;white-space:nowrap;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:linear-gradient(#5a3a22,#3a2414);color:#f6dd92;box-shadow:inset 0 0 0 1px #c9a048}
.track{position:relative;width:42px;height:24px;flex:none;border-radius:12px;border:1.5px solid #8a6a24;background:#0b141c}
.track i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#9aa6ae,#4a5660)}
.track.on{background:#2c6658;border-color:#c9a048}
.track.on i{left:20px;background:radial-gradient(circle at 40% 35%,#fff3c4,#c9a048)}
.hint{font-size:12.5px;line-height:1.3;color:#8fa6b3}
.btn-line{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1.5px solid #c9a048;background:rgba(18,29,39,.9);color:#f0d27a;font-family:'Alegreya SC',Georgia,serif;font-weight:700;font-size:15px;cursor:pointer}
.btn-red{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1.5px solid #e08a6a;background:rgba(142,43,34,.35);color:#ffd8c8;font-family:'Alegreya SC',Georgia,serif;font-weight:700;font-size:15px;cursor:pointer}
.h2 img{flex:none}
.wheelbtn img{transition:rotate .6s cubic-bezier(.3,.7,.2,1)}.wheelbtn:hover img{rotate:180deg}
.egg{display:inline-flex;align-items:center;gap:6px}.egg img{transition:rotate 1.2s ease}.egg:hover img{rotate:-200deg}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</helmet>
<div style="width: 1366px; height: 660px; position: relative; overflow: hidden; font-family: 'Alegreya Sans', system-ui, sans-serif; color: #eef3f6; background: linear-gradient(#3a2614, #22160c)">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 2px, rgba(0,0,0,0) 2px 160px), repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, rgba(0,0,0,0) 1px 44px)"></div>
  <div aria-hidden="true" style="position: absolute; left: 18px; top: 72px; width: 1000px; height: 480px; border-radius: 8px; background: #234a5e; opacity: .55"></div>
  <div aria-hidden="true" style="position: absolute; left: 1050px; top: 72px; width: 296px; height: 480px; border-radius: 8px; background: #efe6cf; opacity: .3"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(4,8,12,.68)"></div>

  <section role="dialog" aria-label="Настройки" class="chart" style="position: absolute; left: 263px; top: 40px; width: 840px; height: 580px; box-sizing: border-box; border: 3px solid #c9a048; border-radius: 14px; box-shadow: inset 0 0 0 1px #5c4615, 0 24px 60px rgba(0,0,0,.6); overflow: hidden; display: flex; flex-direction: column">
    <header style="flex: none; height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 16px 0 22px; background: linear-gradient(#23333f, #15212b); border-bottom: 2px solid #c9a048">
      <span class="wheelbtn"><img src="../assets/icons/ic_wheel.svg" alt="" width="40" height="40" style="display: block"></span>
      <h1 class="sc" style="margin: 0; flex: 1; font-size: 26px; font-weight: 800; color: #f0d27a">Настройки</h1>
      <button aria-label="Закрыть" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid #c9a048; background: radial-gradient(circle at 40% 32%, #f6dd92, #c9a048 60%, #8a6a24); color: #24180a; font-size: 22px; font-weight: 700; line-height: 1; cursor: pointer">×</button>
    </header>

    <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 34px; padding: 18px 26px 0">
      <div>
        <h2 class="h2"><img src="../assets/icons/ic_spyglass.svg" alt="" width="22" height="22">Показ</h2>
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 4px 0 6px"><span class="name">Скорость показа ходов</span><span class="seg" role="group" aria-label="Скорость показа ходов" style="align-self: flex-start"><button aria-pressed="false">Медленно</button><button aria-pressed="true">Обычно</button><button aria-pressed="false">Быстро</button><button aria-pressed="false">Мгновенно</button></span></div>
        <div class="row"><span class="name">Спецэффекты</span><span class="seg" role="group" aria-label="Спецэффекты"><button aria-pressed="true">Богатые</button><button aria-pressed="false">Простые</button></span></div>
        <label class="row"><span class="name">Пропуск показа касанием стола<span class="hint" style="display: block">для телефона</span></span><span class="track"><i></i></span></label>

        <h2 class="h2" style="margin-top: 16px"><img src="../assets/icons/ic_cutlasses.svg" alt="" width="22" height="22">Игра</h2>
        <label class="row"><span class="name">Звук «ваш ход»</span><span class="track on"><i></i></span></label>
        <label class="row"><span class="name">Быстрый конец хода<span class="hint" style="display: block">«Ход окончен · Отменить» — 1 с вместо 3 с</span></span><span class="track"><i></i></span></label>
        <label class="row"><span class="name">Подсказки<span class="hint" style="display: block">урон на целях, «4 → 2» на Реакциях</span></span><span class="track on"><i></i></span></label>
      </div>
      <div>
        <h2 class="h2"><img src="../assets/icons/ic_compass.svg" alt="" width="22" height="22">Вид стола</h2>
        <div class="row"><span class="name">Залп на планшете</span><span class="seg" role="group" aria-label="Залп на планшете"><button aria-pressed="true">Значки</button><button aria-pressed="false">Порты</button></span></div>
        <div class="row"><span class="name">Фон под рукой</span><span class="seg" role="group" aria-label="Фон под рукой"><button aria-pressed="true">Палуба</button><button aria-pressed="false">Стол капитана</button></span></div>
        <div class="row"><span class="name">Рамка моря</span><span class="seg" role="group" aria-label="Рамка моря"><button aria-pressed="true">Фальшборт</button><button aria-pressed="false">Латунь</button></span></div>
        <div class="row"><span class="name">Разбор урона</span><span class="seg" role="group" aria-label="Разбор урона"><button aria-pressed="true">Показывать</button><button aria-pressed="false">Скрыть</button></span></div>

        <div style="margin-top: 14px; display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.05); border: 1px solid rgba(201,160,72,.3)">
          <div aria-hidden="true" style="width: 90px; height: 54px; flex: none; border-radius: 6px; border: 1.5px solid #c9a048; background: linear-gradient(#234a5e, #18384a); position: relative; overflow: hidden">
            <span style="position: absolute; left: 6px; right: 6px; top: 6px; height: 12px; border-radius: 3px; background: #efe6cf"></span>
            <span style="position: absolute; left: 6px; bottom: 6px; width: 34px; height: 14px; border-radius: 3px; background: #c9a048"></span>
            <span style="position: absolute; right: 6px; bottom: 6px; width: 34px; height: 14px; border-radius: 3px; background: #efe6cf"></span>
          </div>
          <span class="hint" style="font-size: 13px">Вид стола меняется сразу — изменения видно за окном.</span>
        </div>
      </div>
    </div>

    <footer style="flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 26px 16px; border-top: 1px solid rgba(201,160,72,.35); background: rgba(10,18,26,.6)">
      <button class="btn-line"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><path d="M8 1 V11 M3.5 6.5 L8 11 L12.5 6.5 M2 14.5 H14" stroke="#f0d27a" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>Скачать журнал</button>
      <button class="btn-line"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><path d="M8 1 V11 M3.5 6.5 L8 11 L12.5 6.5 M2 14.5 H14" stroke="#f0d27a" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>Скачать партию</button>
      <span style="flex: 1; display: flex; justify-content: center"><span class="egg" title="Этот компас показывает не на север, а туда, куда вам действительно нужно" style="font-size: 12px; color: #6f8796"><img src="../assets/icons/ic_compass.svg" alt="" width="20" height="20"><span style="line-height: 1.25">Версия 1a2b3c4<br>24.10, 18:40</span></span></span>
      <button class="btn-red">Сдаться (Пираты)</button>
      <button class="btn-line">Новая партия</button>
    </footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1366,"height":660}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
