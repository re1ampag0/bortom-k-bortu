    for (let i = 0; i < 120; i++) { const a = (i / 120) * Math.PI * 2; if (i % 10 === 0) bezelBig += 'M' + P(a, 47.2) + 'L' + P(a, 49.6); else bezel += 'M' + P(a, 47.2) + 'L' + P(a, i % 5 === 0 ? 49 : 48.3); }
    // wood
    let grain = '';
    for (let r = 38; r < 46.4; r += 0.75) { let a = rnd() * 6.28; while (a < 8.28) { const len = 0.3 + rnd() * 0.9, rr = r + (rnd() - 0.5) * 0.3; grain += 'M' + P(a, rr) + 'A' + f(rr) + ' ' + f(rr) + ' 0 0 1 ' + P(a + len, rr); a += len + 0.15 + rnd() * 0.5; } }
    let seams = '', seamsHi = '';
    for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2 + Math.PI / 12; seams += 'M' + P(a, 37) + 'L' + P(a, 46.6); seamsHi += 'M' + P(a + 0.012, 37) + 'L' + P(a + 0.012, 46.6); }
    const between = [-170, -120, -60, -10];
    let cracks = '';
    for (const deg of between) { let a = deg * D; cracks += 'M' + P(a, 46); for (let r = 44.4; r > 38; r -= 1.6) { a += (rnd() - 0.5) * 0.09; cracks += 'L' + P(a, r); } }
    let diamonds = '', studs = '', moss = '';
    for (const deg of between) { const a = deg * D, x = X(a, 42), y = Y(a, 42); diamonds += 'M' + f(x) + ' ' + f(y - 1.9) + 'l1.2 1.9l-1.2 1.9l-1.2 -1.9z'; studs += circ(x, y, 1.15); }
    for (let i = 0; i < 7; i++) { const a = (185 + rnd() * 170) * D, r = 39 + rnd() * 6; moss += circ(X(a, r), Y(a, r), 1.2 + rnd() * 1.8); }
    let rose = '';
    for (let i = 0; i < 16; i++) { const a = (i / 16) * Math.PI * 2; rose += 'M0 0L' + P(a, i % 2 ? 32.6 : 35.4); }
    let burn = '';
    for (let k = 0; k < 5; k++) { let a = (k * 72 + rnd() * 30) * D; burn += 'M' + P(a, 34.6); for (let j = 0; j < 6; j++) { a += 0.06 + rnd() * 0.05; burn += 'L' + P(a, 33.8 + rnd() * 1.4); } }
    // hull cells, one per point of damage
    const n = Math.max(1, Math.min(5, Math.round(Number(this.props.dmg ?? 3))));
    const cells = {};
    const ax = -26, bxA = 26, ay = 42.7, cy = 74;
    for (let i = 1; i <= 5; i++) {
      const on = i <= n, u = n === 1 ? 0.5 : 0.5 + (i - 1 - (n - 1) / 2) * (n > 3 ? 0.2 : 0.25);
      const x = ax + (bxA - ax) * u, y = (1 - u) * (1 - u) * ay + 2 * u * (1 - u) * cy + u * u * ay;
      cells['s' + i] = on ? '1' : '0'; cells['hx' + i] = f(on ? x : 0); cells['hy' + i] = f(on ? y : 0);
    }
    const hal = 'M' + ax + ' ' + ay + 'Q0 ' + cy + ' ' + bxA + ' ' + ay;
    return { t, nameLen, hal, ax, bx: bxA, ay, kelp, kelpRib, kelpB, kelpBHi, filig, stars, rope, ropeHi, barn, barnHole, chainA, chainB, embers, pearls, pearlsSh, pearlsHi, bezel, bezelBig, grain, seams, seamsHi, cracks, diamonds, studs, moss, rose, burn, ...cells, size: this.props.size ?? 300, n0: '3', label: 'Печать «' + t.name + '»: 3 по Корпусу — Пушки 3, Греческий огонь +1, Водоворот −1' };
  }
