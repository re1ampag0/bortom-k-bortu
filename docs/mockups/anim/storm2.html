<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
@font-face{font-family:Alegreya;font-weight:800;src:url(fonts/alegreya-cyrillic-800-normal.woff2)}
@font-face{font-family:"Alegreya Sans";font-weight:500;src:url(fonts/alegreya-sans-cyrillic-500-normal.woff2)}
@font-face{font-family:"Alegreya Sans";font-weight:700;src:url(fonts/alegreya-sans-cyrillic-700-normal.woff2)}
@font-face{font-family:"Alegreya Sans";font-weight:700;src:url(fonts/alegreya-sans-latin-700-normal.woff2);unicode-range:U+0000-00FF}
body{margin:0;width:560px;height:400px;background:#F3EEE4;font-family:"Alegreya Sans";position:relative;overflow:hidden}
.bar{position:absolute;left:0;right:0;top:0;height:40px;background:#FBF8F1;border-bottom:1px solid #D9CFBF;display:flex;align-items:center;padding:0 14px;font-size:14px;color:#2A2521;font-weight:700}
.chip{position:absolute;right:14px;top:7px;display:flex;align-items:center;gap:6px;border:1.5px solid #24465C;border-radius:8px;padding:3px 9px;background:#fff;font-size:13.5px;opacity:0;animation:fadein .3s 2.75s forwards}
@keyframes fadein{to{opacity:1}}
.dim{position:absolute;inset:40px 0 0 0;background:#1d2a35;opacity:0;animation:dim 2.9s both}
@keyframes dim{0%{opacity:0}15%{opacity:.18}80%{opacity:.18}100%{opacity:0}}
.sea{position:absolute;left:150px;top:62px;width:260px;border-radius:14px;overflow:hidden;background:#FBF8F1;box-shadow:0 16px 40px rgba(20,40,55,.35),0 0 0 1.5px #24465C;
 animation:in .45s cubic-bezier(.2,.9,.3,1.25) both, shake .35s .95s both, shake2 .25s 1.55s both, out .45s 2.35s ease-in forwards}
@keyframes in{from{opacity:0;transform:scale(.78) translateY(16px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
@keyframes shake2{0%,100%{transform:none}30%{transform:translate(2px,1px)}60%{transform:translate(-2px,-1px)}}
@keyframes out{from{opacity:1;transform:none}to{opacity:0;transform:translate(150px,-96px) scale(.16)}}
.art{height:124px;position:relative;overflow:hidden;background:linear-gradient(#3A4855,#5A6B7C);animation:sky 1s .1s both}
@keyframes sky{from{background-color:#5A6B7C;filter:brightness(1.25)}to{filter:brightness(.82)}}
.kind{position:absolute;left:12px;top:9px;font-size:12px;font-weight:700;color:#fff;opacity:.9;z-index:6}
.cloud{position:absolute}
.c1{left:6px;top:14px;animation:cl .75s .1s cubic-bezier(.2,.8,.3,1) both}
.c2{left:112px;top:10px;animation:cr .75s .15s cubic-bezier(.2,.8,.3,1) both}
.c3{left:60px;top:-4px;opacity:.75;animation:ct .8s .05s cubic-bezier(.2,.8,.3,1) both}
@keyframes cl{from{transform:translateX(-140px)}to{transform:none}}
@keyframes cr{from{transform:translateX(140px)}to{transform:none}}
@keyframes ct{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:.75}}
.wind{position:absolute;left:0;top:0;width:100%;height:100%;z-index:4}
.wind path{fill:none;stroke:#E8EEF2;stroke-width:2;stroke-linecap:round;stroke-dasharray:60 400;stroke-dashoffset:460;opacity:.7}
.w1{animation:wind 1s .35s ease-out both}.w2{animation:wind 1s .55s ease-out both}.w3{animation:wind 1s 1.6s ease-out both}
@keyframes wind{to{stroke-dashoffset:-60}}
.boltL{position:absolute;inset:0;z-index:3}
.boltL path{fill:none;stroke:#FFE58A;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 6px #FFD84A) drop-shadow(0 0 14px #FFF4C2)}
.b1{stroke-width:4;stroke-dasharray:160;stroke-dashoffset:160;opacity:0;animation:draw .18s .95s forwards, fadeb .9s 1.15s forwards}
.b1b{stroke-width:2.2;stroke-dasharray:60;stroke-dashoffset:60;opacity:0;animation:draw .12s 1.05s forwards, fadeb .8s 1.2s forwards}
.b2{stroke-width:3;stroke-dasharray:120;stroke-dashoffset:120;opacity:0;animation:draw .15s 1.55s forwards, fadeb .7s 1.72s forwards}
@keyframes draw{0%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
@keyframes fadeb{0%{opacity:1}30%{opacity:.25}45%{opacity:1}100%{opacity:0}}
.flash{position:absolute;inset:0;background:#fff;z-index:5;opacity:0;animation:flash 1s .95s both}
@keyframes flash{0%{opacity:0}6%{opacity:.9}18%{opacity:0}28%{opacity:.45}36%{opacity:0}60%{opacity:0}64%{opacity:.6}72%{opacity:0}100%{opacity:0}}
.rain{position:absolute;inset:40px 0 0 0;z-index:2;opacity:0;animation:rainvis 2.8s both}
@keyframes rainvis{0%,26%{opacity:0}36%{opacity:1}82%{opacity:1}100%{opacity:0}}
.rain i{position:absolute;width:2px;height:16px;border-radius:2px;background:linear-gradient(transparent,#C7D6E2);transform:rotate(22deg);animation:drop .45s linear infinite}
@keyframes drop{from{transform:translate(0,-30px) rotate(22deg)}to{transform:translate(-26px,70px) rotate(22deg)}}
.splash{position:absolute;bottom:2px;width:10px;height:3px;border-radius:50%;border:1.5px solid #C7D6E2;opacity:0;animation:spl .45s linear infinite}
@keyframes spl{0%{opacity:0;transform:scale(.3)}50%{opacity:.8}100%{opacity:0;transform:scale(1.6)}}
.body{padding:12px 16px 14px;text-align:center}
.t{font-family:Alegreya;font-weight:800;font-size:31px;line-height:1;color:#2A2521}
.fx{margin-top:7px;font-size:17px;font-weight:700;color:#24465C}
.dur{margin-top:8px;display:inline-block;font-size:12.5px;font-weight:500;color:#6B6157;border:1px solid #D9CFBF;border-radius:20px;padding:2px 10px}
</style></head><body>
<div class="bar">Раунд 2 · Ход Пиратов</div>
<div class="dim"></div>
<div class="chip"><svg width="22" height="16" viewBox="0 0 150 90"><g fill="#58697A"><ellipse cx="62" cy="38" rx="34" ry="20"/><ellipse cx="92" cy="34" rx="28" ry="22"/><rect x="38" y="40" width="80" height="20" rx="10"/></g><path d="M80 58 L68 78 H78 L70 92 L92 68 H80 L88 58Z" fill="#E0A800"/></svg><b>Буря</b>&nbsp;· Залпы −1</div>
<div class="sea"><div class="art"><span class="kind">Море · весь раунд</span>
 <svg class="cloud c3" width="150" height="56" viewBox="0 0 150 56"><g fill="#6B7A88"><ellipse cx="60" cy="28" rx="44" ry="22"/><ellipse cx="104" cy="30" rx="34" ry="18"/></g></svg>
 <svg class="cloud c1" width="130" height="66" viewBox="0 0 130 66"><g fill="#C9D0D6"><ellipse cx="56" cy="30" rx="36" ry="22"/><ellipse cx="30" cy="40" rx="24" ry="15"/><rect x="18" y="34" width="96" height="22" rx="11"/></g><g fill="#E6EAEE"><ellipse cx="52" cy="24" rx="26" ry="14"/></g><rect x="18" y="46" width="96" height="10" rx="5" fill="#9AA6B0"/></svg>
 <svg class="cloud c2" width="140" height="66" viewBox="0 0 140 66"><g fill="#C9D0D6"><ellipse cx="66" cy="28" rx="34" ry="24"/><ellipse cx="100" cy="40" rx="26" ry="15"/><rect x="14" y="34" width="110" height="22" rx="11"/></g><g fill="#E6EAEE"><ellipse cx="62" cy="20" rx="24" ry="13"/></g><rect x="14" y="46" width="110" height="10" rx="5" fill="#9AA6B0"/></svg>
 <svg class="boltL" viewBox="0 0 260 124"><path class="b1" d="M132 58 L118 80 L130 82 L114 112 L122 96"/><path class="b1b" d="M124 84 L140 96 L134 104"/><path class="b2" d="M200 54 L192 72 L200 74 L188 98"/></svg>
 <svg class="wind" viewBox="0 0 260 124"><path class="w1" d="M-10 96 C60 84 120 108 270 90"/><path class="w2" d="M-10 112 C80 100 150 120 270 104"/><path class="w3" d="M-10 80 C70 70 140 92 270 76"/></svg>
 <div class="flash"></div></div>
 <div class="body"><div class="t">Буря</div><div class="fx">Каждый Залп −1 урон</div><span class="dur">до следующей карты моря</span></div></div>
<div class="rain" id="rain"></div>
<script>
const r=document.getElementById('rain');
for(let i=0;i<70;i++){const d=document.createElement('i');d.style.left=(Math.random()*600)+'px';d.style.top=(Math.random()*330)+'px';d.style.animationDelay=(-Math.random()*.45)+'s';d.style.opacity=.35+Math.random()*.5;r.appendChild(d)}
for(let i=0;i<14;i++){const s=document.createElement('b');s.className='splash';s.style.left=(Math.random()*540)+'px';s.style.animationDelay=(-Math.random()*.45)+'s';r.appendChild(s)}
</script></body></html>
