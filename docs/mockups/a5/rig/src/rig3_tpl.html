<style>

<div class="page">
<h1>Оснастка стола</h1>
<p class="lead">Варианты, как добавить на стол настоящую корабельную оснастку: канаты и узлы, пушечные порты, латунь, вывески, палубу. Всё нарисовано своим SVG по мотивам линейных кораблей XVIII века и пиратских судов — без чужих картинок. Вторая версия — доработано по твоим замечаниям.</p>
<div id="secs"></div>
</div>
<svg id="meas" width="0" height="0" style="position:absolute"></svg>

<script>
const SHIPS = __SHIPS__;
const CELLS = __CELLS__;
const IC = __ICONS__;
const NS = 'http://www.w3.org/2000/svg';
const R1 = n => Math.round(n * 10) / 10;
let uid = 0; const U = p => p + (uid++);

/* ================= rope: strands laid along any path ================= */
const meas = document.getElementById('meas');
function pathLen(d){ const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); meas.appendChild(p); return p; }
function rope(d, w, o = {}){ // returns svg markup of a twisted three-strand rope along d
  const p = pathLen(d), L = p.getTotalLength(), step = w * (o.lay || .58), g = U('rg');
  const c = o.c || ['#ecd59c', '#c29a56', '#7a5524'], dark = o.dark || '#4a3214';
  let s = `<defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset=".55" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[2]}"/></linearGradient></defs>`;
  s += `<path d="${d}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="${w + 2}" stroke-linecap="round" transform="translate(${w * .18} ${w * .3})"/>`;
  s += `<path d="${d}" fill="none" stroke="${dark}" stroke-width="${w + .8}" stroke-linecap="round"/>`;
  for(let t = step / 2; t < L; t += step){ const a = p.getPointAtLength(t), b = p.getPointAtLength(Math.min(L, t + .5)), q = p.getPointAtLength(Math.max(0, t - .5));
    const ang = Math.atan2(b.y - q.y, b.x - q.x) * 180 / Math.PI;
    s += `<ellipse cx="0" cy="0" rx="${R1(w * .56)}" ry="${R1(w * .3)}" transform="translate(${R1(a.x)} ${R1(a.y)}) rotate(${R1(ang + (o.left ? -58 : 58))})" fill="url(#${g})" stroke="${dark}" stroke-width="${R1(Math.max(.35, w * .05))}"/>`; }
  p.remove(); return s; }
function lashing(x, y, w, n = 5, ang = 45){ let s = ''; for(let i = 0; i < n; i++){ const o = (i - (n - 1) / 2) * w * .42; s += `<ellipse cx="0" cy="${R1(o)}" rx="${R1(w * 1.05)}" ry="${R1(w * .2)}" transform="translate(${x} ${y}) rotate(${ang})" fill="#b78f52" stroke="#4a3214" stroke-width=".5"/>`; } return s; }
function monkeyFist(x, y, r){ const g = U('mf'), cl = U('mc'); let s = `<defs><radialGradient id="${g}" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#f0dca6"/><stop offset=".6" stop-color="#b48a4a"/><stop offset="1" stop-color="#5a3e18"/></radialGradient><clipPath id="${cl}"><circle cx="${x}" cy="${y}" r="${r}"/></clipPath></defs><circle cx="${x}" cy="${y}" r="${r}" fill="url(#${g})" stroke="#4a3214" stroke-width=".8"/><g clip-path="url(#${cl})" fill="none" stroke="#5a3e18" stroke-width=".7" opacity=".85">`;
  for(let i = -2; i <= 2; i++) s += `<path d="M${x - r} ${y + i * r * .34} Q${x} ${y + i * r * .34 - r * .25} ${x + r} ${y + i * r * .34}"/>`;
  for(let i = -1; i <= 1; i++) s += `<path d="M${x + i * r * .36} ${y - r} Q${x + i * r * .36 + r * .3} ${y} ${x + i * r * .36} ${y + r}" stroke="#f3e2b0" stroke-width="1"/>`;
  return s + `</g><circle cx="${x - r * .35}" cy="${y - r * .38}" r="${r * .22}" fill="#fff6d8" opacity=".35"/>`; }

/* ================= iron, brass, wood ================= */
function gradDefs(){ return `<defs>
  <linearGradient id="gIron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d858a"/><stop offset=".3" stop-color="#3c4246"/><stop offset=".75" stop-color="#1b1e20"/><stop offset="1" stop-color="#2c3134"/></linearGradient>
  <linearGradient id="gBrass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b8"/><stop offset=".35" stop-color="#e2bf62"/><stop offset=".7" stop-color="#9a7020"/><stop offset="1" stop-color="#d8b05a"/></linearGradient>
  <radialGradient id="gBrassR" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff3c4"/><stop offset=".35" stop-color="#e2bf62"/><stop offset=".8" stop-color="#8f6b20"/><stop offset="1" stop-color="#5e4210"/></radialGradient>
  <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b07a44"/><stop offset=".5" stop-color="#8a5a2c"/><stop offset="1" stop-color="#5e3a18"/></linearGradient>
  <linearGradient id="gWoodD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e4a2a"/><stop offset=".5" stop-color="#4e321a"/><stop offset="1" stop-color="#2e1c0c"/></linearGradient>
  <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3352a"/><stop offset="1" stop-color="#6e1610"/></linearGradient>
  <radialGradient id="gBall" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#8a9296"/><stop offset=".5" stop-color="#2e3336"/><stop offset="1" stop-color="#121416"/></radialGradient>
  <radialGradient id="gFlash" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffbe6"/><stop offset=".35" stop-color="#ffd25a"/><stop offset=".7" stop-color="#ff7a1e" stop-opacity=".7"/><stop offset="1" stop-color="#ff5a10" stop-opacity="0"/></radialGradient>
  <radialGradient id="gSmoke" cx=".45" cy=".4" r=".6"><stop offset="0" stop-color="#fbf8f2"/><stop offset=".7" stop-color="#d9d3c8"/><stop offset="1" stop-color="#b8b0a4" stop-opacity="0"/></radialGradient>
  </defs>`; }

/* a naval gun on its truck carriage, side view, muzzle to the right; box 0..124 × 0..62 */
function cannon(o = {}){ const rings = [16, 23, 50, 54, 92, 112].map(x => `<path d="M${x} ${23 - (x < 52 ? 8.6 : 6.6) + (x - 10) * .012} V${25 + (x < 52 ? 8.6 : 6.6) - (x - 10) * .012}" stroke="#8b9397" stroke-width="1.6" opacity=".7"/>`).join('');
  return `<g>
  <ellipse cx="60" cy="59.5" rx="52" ry="2.6" fill="#000" opacity=".3"/>
  <path d="M18 49 V41 H33 V35 H49 V29 H86 L90 34 V49 Z" fill="url(#gWood)" stroke="#3a2412" stroke-width="1"/>
  <path d="M18 41 H33 M33 35 H49 M49 29 H86" stroke="#d8a868" stroke-width=".8" opacity=".6"/>
  <path d="M22 47 H86" stroke="#3a2412" stroke-width=".6" opacity=".5"/>
  ${[[26, 45], [42, 39], [58, 33], [80, 33], [80, 46], [40, 48]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.4" fill="#2b2f31" stroke="#9aa2a6" stroke-width=".4"/>`).join('')}
  <path d="M20 35 L36 35 L36 38 L20 41 Z" fill="#a8743e" stroke="#3a2412" stroke-width=".7"/>
  <path d="M8 24 Q8 15.4 14 15.2 L52 16.4 L52 15.8 L56 15.8 L56 17 L104 18.6 Q110 17.6 114 17.4 L119 17.2 V30.8 L114 30.6 Q110 30.4 104 29.4 L56 31 L56 32.2 L52 32.2 L52 31.6 L14 32.8 Q8 32.6 8 24 Z" fill="url(#gIron)" stroke="#0d0f10" stroke-width="1"/>
  ${rings}
  <path d="M14 17.6 Q40 17.4 104 20" stroke="#c9d1d4" stroke-width="1" fill="none" opacity=".5"/>
  <ellipse cx="119" cy="24" rx="2" ry="6.8" fill="#121416" stroke="#0d0f10"/><ellipse cx="119.4" cy="24" rx="1" ry="3.6" fill="#000"/>
  <circle cx="3.6" cy="24" r="3.6" fill="url(#gIron)" stroke="#0d0f10" stroke-width=".8"/><path d="M6 22.6 H9 V25.4 H6 Z" fill="#2c3134"/>
  <circle cx="62" cy="27" r="3.4" fill="#3c4246" stroke="#0d0f10" stroke-width=".8"/><path d="M57.4 25 Q62 21.6 66.6 25 L66.6 27.6 L57.4 27.6 Z" fill="#2c3134" stroke="#0d0f10" stroke-width=".6"/>
  <rect x="22" y="49" width="20" height="4" fill="#3a2412"/><rect x="68" y="49" width="20" height="4" fill="#3a2412"/>${[[31, 54], [77, 53.4]].map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="${i ? 6.6 : 6}" fill="url(#gWoodD)" stroke="#2a180a" stroke-width="1"/><circle cx="${x}" cy="${y}" r="${i ? 4.6 : 4.2}" fill="none" stroke="#a8743e" stroke-width=".8" opacity=".6"/><circle cx="${x}" cy="${y}" r="2.2" fill="#2b2f31" stroke="#9aa2a6" stroke-width=".5"/>`).join('')}
  ${o.rope === false ? '' : rope('M26 41 C14 40 2 34 3.6 27.6 C4.6 22 10 26 12 30 C16 38 30 42 40 41', 2.4)}
  </g>`; }

/* a gun port seen from the side of the hull: frame, red inside, the lid up on hinges, the muzzle */
function port(x, y, s, open = true, o = {}){ const k = s / 20;
  return `<g transform="translate(${x} ${y}) scale(${R1(k * 100) / 100})">
  ${open ? `<path d="M-1 -2 L21 -2 L19.6 -8.6 L.4 -8.6 Z" fill="url(#gRed)" stroke="#2a0a06" stroke-width=".8"/><path d="M3 -2 L2.6 -8 M17 -2 L17.4 -8" stroke="#1a1c1e" stroke-width="1.3"/>` : ''}
  <rect x="-1.5" y="-1.5" width="23" height="23" rx="1" fill="#2a1d10"/>
  ${open ? `<rect x="1" y="1" width="18" height="18" fill="#7e1d14"/><rect x="1" y="1" width="18" height="4" fill="#4a0e09"/>
    ${o.gun === false ? '' : `<circle cx="10" cy="11" r="6.4" fill="url(#gIron)" stroke="#0d0f10" stroke-width=".8"/><circle cx="10" cy="11" r="4.6" fill="none" stroke="#8b9397" stroke-width=".7" opacity=".7"/><circle cx="10" cy="11" r="3" fill="#050505"/>`}`
   : `<rect x="1" y="1" width="18" height="18" fill="${o.lid || '#1d1b19'}" stroke="#000" stroke-width=".6"/><path d="M1 5 H19 M1 15 H19" stroke="#55504a" stroke-width="1.2"/><circle cx="3.4" cy="5" r=".9" fill="#88807a"/><circle cx="3.4" cy="15" r=".9" fill="#88807a"/>`}
  </g>`; }

/*__ST3__*/
/* ================= more metal and wood ================= */
function defs2(){ return `<defs>
  <linearGradient id="gIron2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d6569"/><stop offset=".14" stop-color="#a7b0b4"/><stop offset=".24" stop-color="#5a6266"/><stop offset=".6" stop-color="#23272a"/><stop offset=".86" stop-color="#121416"/><stop offset="1" stop-color="#2f3539"/></linearGradient>
  <linearGradient id="gRing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6c7478"/><stop offset=".12" stop-color="#c4cccf"/><stop offset=".3" stop-color="#5d6569"/><stop offset=".7" stop-color="#1d2123"/><stop offset="1" stop-color="#3a4044"/></linearGradient>
  <linearGradient id="gOak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a87444"/><stop offset=".08" stop-color="#c79260"/><stop offset=".2" stop-color="#94623a"/><stop offset=".8" stop-color="#6e4526"/><stop offset="1" stop-color="#4a2c14"/></linearGradient>
  <radialGradient id="gTruck" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#9a6a3e"/><stop offset=".7" stop-color="#5e3a1c"/><stop offset="1" stop-color="#3a2210"/></radialGradient>
  <radialGradient id="gAO" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <linearGradient id="gSpec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="gWine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e2a22"/><stop offset=".5" stop-color="#561a14"/><stop offset="1" stop-color="#3e110c"/></linearGradient>
  <linearGradient id="gHull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a1c"/><stop offset="1" stop-color="#1e140c"/></linearGradient>
  <linearGradient id="gPortIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3e0b07"/><stop offset=".35" stop-color="#7e1d14"/><stop offset="1" stop-color="#9a2a1e"/></linearGradient>
  </defs>`; }

/* a realistic naval gun on its truck carriage — the same shape, more metal, more wood, more shadow; box 0..124 × 0..62 */
function cannon2(o = {}){ const id = U('cn');
  const ringR = (x, w, r, cy = 24) => `<rect x="${x}" y="${R1(cy - r)}" width="${w}" height="${R1(r * 2)}" rx=".6" fill="url(#gRing)" stroke="#0b0c0d" stroke-width=".55"/><path d="M${x + .4} ${R1(cy - r + .7)} H${x + w - .4}" stroke="#e6ecee" stroke-width=".5" opacity=".7"/>`;

/* a Turk's head: three strands woven over and under around a ring; each strand is cut where it turns, the "under" pieces go first */
function turksHead(cx, cy, r, A, B, w, o = {}){ const N = 720, c = o.c || ['#3e2a10', '#b8935a', '#f2dfae']; const under = [], over = [];
  for(let s = 0; s < 3; s++){ const ph = s * Math.PI * 2 / 3; let cur = null, sign = 0;
    for(let i = 0; i <= N; i++){ const t = i / N * Math.PI * 2, th = B * t + ph, rr = r + A * Math.sin(th), x = R1(cx + Math.cos(t) * rr), y = R1(cy + Math.sin(t) * rr), sg = Math.cos(th) >= 0 ? 1 : -1;
      if(sg !== sign){ if(cur){ cur.pts.push([x, y]); (sign > 0 ? over : under).push(cur); } cur = {pts: [[x, y]]}; sign = sg; } else cur.pts.push([x, y]); }
    if(cur) (sign > 0 ? over : under).push(cur); }
  const draw = pc => { const d = 'M' + pc.pts.map(p => p.join(' ')).join(' L');
    return `<path d="${d}" fill="none" stroke="${c[0]}" stroke-width="${w + 1.6}" stroke-linecap="butt" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${c[1]}" stroke-width="${w}" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${c[2]}" stroke-width="${R1(w * .3)}" stroke-linejoin="round" opacity=".75" transform="translate(-.25 -.35)"/>`; };
  return under.map(draw).join('') + over.map(draw).join(''); }

function compassArt(uid, r = 74, o = {}){
  const id = k => `pgC${uid}${k}`, P = a => [Math.cos(a), Math.sin(a)], f = n => R1(n * 100) / 100;
  const ticks = Array.from({length: 120}, (_, i) => { const a = i * 3 * Math.PI / 180 - Math.PI / 2, big = i % 30 === 0, mid = i % 10 === 0, half = i % 5 === 0;
    const r0 = r * .855, l = r * (big ? .1 : mid ? .072 : half ? .05 : .03), [c, sn] = P(a);
    return `<path d="M${f(c * r0)} ${f(sn * r0)} L${f(c * (r0 - l))} ${f(sn * (r0 - l))}" stroke="#2a2018" stroke-width="${f(r * (big ? .02 : mid ? .013 : .008))}"/>`; }).join('');
  const point = (deg, len, wid, light, dark) => { const a = deg * Math.PI / 180 - Math.PI / 2, [c, sn] = P(a), [lc, ls] = P(a - Math.PI / 2);

  const mute = o.needle !== false;   // with a needle on top the rose steps back, so the needle reads at once
  const minor = Array.from({length: 8}, (_, i) => point(22.5 + i * 45, r * .36, r * .045, mute ? '#e6d8b2' : '#d9c38e', mute ? '#c4aa6c' : '#a8873e')).join('');
  const inter = [45, 135, 225, 315].map(d => point(d, r * .5, r * .085, mute ? '#f2e8cc' : '#efe2bf', mute ? '#bfa266' : '#8f6e2c')).join('');
  const card = [[0, mute ? '#eab4a6' : '#e0503a', mute ? '#c98a7a' : '#9c2216'], ...[90, 180, 270].map(d => [d, mute ? '#faf5ea' : '#f7f1e3', mute ? '#a8957a' : '#2c241c'])].map(([d, l, dk]) => point(d, r * .6, r * .115, l, dk)).join('');
  const letters = [['С', 0, '#b8281c'], ['В', 90, '#2a2018'], ['Ю', 180, '#2a2018'], ['З', 270, '#2a2018']].map(([t, d, c]) => { const [x, y] = P(d * Math.PI / 180 - Math.PI / 2); return `<text x="${f(x * r * .69)}" y="${f(y * r * .69 + r * .05)}" font-family="'Old Standard TT',Georgia,serif" font-weight="700" font-size="${f(r * .14)}" text-anchor="middle" fill="${c}">${t}</text>`; }).join('');
  const nl = r * .8, nw = r * .062;
  const needle = `<g class="nd"><path d="M${f(r * .03)} ${f(-nl + r * .04)} L${f(nw + r * .03)} ${f(r * .04)} L${f(r * .03)} ${f(nl + r * .04)} L${f(-nw + r * .03)} ${f(r * .04)} Z" fill="#000" opacity=".28"/>

  return `<g><defs>

SEC.push({h: 'Корабли', why: 'Третья версия, на основе прежних больших кораблей: обшивка со стыками досок, пояса и брусья, открытые порты с откинутыми крышками и дулами, абордажные сетки вдоль борта, руслени с юферсами и вант-путенсами, гальюн с поручнями, двухъярусная кормовая галерея с огнями, фонари со свечением, руль; бушприт с утлегарем, блиндом, ватер-штагами; марсы, бугели на мачтах, перты под реями, брасы; паруса с градиентом, швами, двумя рядами риф-сезней, заплатами и дырами. На шапке планшета — облегчённая версия. «Жемчужина» — чёрный корпус и чёрные рваные паруса; «Месть» — красный пояс и выцветшие паруса; «Индевор» — линейный корабль в два ряда портов с шахматными поясами и полным белым парусным вооружением; «Голландец» — облезлый зелёно-серый корпус в ракушках, сломанная фор-стеньга, паруса в дырах, зелёный свет в окнах.', vs: [
  {k: '', t: 'Крупно', sub: '×3', st: stage(1000, 200, `<div class="abs" style="left:10px;top:10px;display:flex;gap:10px">${['pearl', 'revenge', 'endeavour', 'dutch'].map(k => `<div style="width:235px;height:155px;border-radius:6px;background:#f4ead6;display:flex;align-items:center;justify-content:center"><svg width="226" height="146" viewBox="0 0 120 78">${SHIPS3[k]}</svg></div>`).join('')}</div><div class="abs" style="left:10px;top:172px;color:#efe3c8;font-size:12px;display:flex;gap:10px">${['Чёрная жемчужина', 'Месть королевы Анны', 'Индевор', 'Летучий голландец'].map(n => `<span style="width:235px;text-align:center">${n}</span>`).join('')}</div>`)},

/* the deck */
function deck(W, H, seed = 7){ let r = seed; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280; const ph = 21; let s = '';
  for(let y = 0, row = 0; y < H; y += ph, row++){ let x = -rnd() * 160; while(x < W){ const len = 150 + rnd() * 140, tone = 36 + rnd() * 14, hue = 26 + rnd() * 6;
      s += `<rect x="${R1(x)}" y="${y}" width="${R1(len)}" height="${ph}" fill="hsl(${R1(hue)} 38% ${R1(tone * .62)}%)"/>`;
      s += `<path d="M${R1(x)} ${y + 3} q${R1(len / 2)} ${R1(rnd() * 2 - 1)} ${R1(len)} 0 M${R1(x)} ${y + 9} q${R1(len / 2)} ${R1(rnd() * 2 - 1)} ${R1(len)} 0 M${R1(x)} ${y + 15} q${R1(len / 2)} ${R1(rnd() * 2 - 1)} ${R1(len)} 0" stroke="#000" stroke-opacity=".12" stroke-width=".6" fill="none"/>`;
      s += `<rect x="${R1(x)}" y="${y}" width="${R1(len)}" height="1.2" fill="#fff" opacity=".05"/><rect x="${R1(x + len - 1.4)}" y="${y}" width="1.4" height="${ph}" fill="#0d0703"/>`;
