<title>Бортом к борту · A5 вживую</title>

<style>
/* Layout: a thin bar of tabs over the A5 artboard (1366×660), scaled to the width. The artboards are the A5 markup as is. */
__FONTS__
:root{--pg-bg:#1a120c;--pg-fg:#efe3c8;--pg-mut:#b5a585;--pg-brass:#e0bd62;color-scheme:dark}
html,body{background:var(--pg-bg);color:var(--pg-fg)}
body{font-family:'Alegreya Sans',system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
.pg-top{max-width:1366px;margin:0 auto 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.pg-top h1{margin:0;font-family:'Old Standard TT',Georgia,serif;font-size:20px;letter-spacing:.06em;color:var(--pg-brass);flex:1 1 260px}
.pg-tabs{display:flex;flex-wrap:wrap;gap:4px}
.pg-tabs button{font:inherit;font-weight:700;font-size:14px;border:1px solid #5a4630;background:#2a1e14;color:var(--pg-fg);padding:6px 14px;border-radius:4px;cursor:pointer}
.pg-tabs button[aria-pressed="true"]{background:linear-gradient(#e0bd62,#8f6b20);color:#22180c;border-color:#f0d48e}
.pg-lbl{align-self:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--pg-mut);margin-right:4px}
.pg-tabs select{font:inherit;font-weight:700;font-size:14px;border:1px solid #5a4630;background:#2a1e14;color:var(--pg-fg);padding:5px 8px;border-radius:4px}
.pg-tabs button:focus-visible{outline:2px solid var(--pg-brass);outline-offset:2px}
.pg-hint{max-width:1366px;margin:0 auto 10px;font-size:13.5px;line-height:1.45;color:var(--pg-mut)}
.pg-hint b{color:var(--pg-fg)}
.pg-wrap{max-width:1366px;margin:0 auto;position:relative}
.pg-scaler{position:relative;width:1366px;height:660px;transform-origin:0 0}
.pg-stage{position:absolute;inset:0;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.6)}
.pg-stage .card{transition:transform .18s ease-out, box-shadow .18s, opacity .18s, filter .18s;cursor:pointer}
.pg-stage .card.pg-hover{z-index:20!important}
.pg-stage .card.pg-sel{z-index:30!important;box-shadow:0 0 0 2.5px #e9b44c,0 0 22px rgba(233,180,76,.7),0 16px 26px rgba(0,0,0,.6)!important;opacity:1!important;filter:none!important}
.pg-stage .card.pg-sel .x{-webkit-line-clamp:unset!important;display:block!important;overflow:visible!important}
.pg-stage .pg-click{cursor:pointer}
.pg-stage .pg-click:hover{filter:brightness(1.07)}
.pg-pill{position:absolute;right:14px;top:560px;z-index:40;display:flex;align-items:center;gap:10px;height:36px;padding:0 18px;border:0;border-radius:18px;background:linear-gradient(#a8382c,#7e2219);box-shadow:inset 0 0 0 1.5px #e0bd62,0 6px 14px rgba(0,0,0,.55);font-family:'Old Standard TT',serif;font-weight:700;font-size:15px;letter-spacing:.04em;color:#f6e7c6;cursor:pointer}
.pg-fade{animation:pgfade .22s ease-out}
.pg-stage .pg-ref{color:#8e2b22;font-weight:700;text-decoration:underline dotted rgba(142,43,34,.55);text-underline-offset:2px;cursor:help}
.pg-stage .pg-ref:hover,.pg-stage .pg-ref:focus-visible{background:rgba(224,189,98,.35);outline:none;border-radius:2px}
.pg-stage .lg i.pg-ico{display:flex;align-items:flex-start;justify-content:center;padding-top:1px}
.pg-stage .pg-tray{position:absolute;display:flex;align-items:center;gap:8px;z-index:2}
.pg-stage .pg-tray .pg-tl{font-family:'Old Standard TT',serif;font-weight:700;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#efe3c8;white-space:nowrap;line-height:1.1}
.pg-stage .pg-tray .pg-box{display:flex;gap:2px;padding:3px 6px;background:#3f2a1a;border-radius:5px;box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
.pg-stage .pg-toks{display:flex;gap:3px;align-items:center}
.pg-stage .pg-st .mh{white-space:nowrap;min-width:0}
.pg-stage .pg-st .mh small{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.pg-stage .pg-tok{position:relative;flex:0 0 24px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#fffaf0,#e9dbbc 75%);box-shadow:inset 0 0 0 1px #6b5a40,inset 0 0 0 2.2px rgba(255,250,235,.8),0 1px 2px rgba(0,0,0,.45);cursor:help}
.pg-stage .pg-tok b{position:absolute;right:-4px;bottom:-3px;min-width:13px;height:13px;border-radius:7px;background:#efe3c8;color:#2a2521;font:700 9.5px/13px 'Old Standard TT',serif;text-align:center;box-shadow:0 0 0 1px #2a2521}
.pg-stage .pg-fire svg{animation:pgflick 1.1s ease-in-out infinite alternate;transform-origin:50% 90%}
@keyframes pgflick{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.12) rotate(3deg)}}
.pg-stage .pg-tags{margin-left:auto;display:flex;gap:4px}
.pg-stage .pg-tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px 0 3px;border-radius:2px 9px 9px 2px;background:#fbf5e7;box-shadow:inset 0 0 0 1px #8a7550;font:700 11px/1 'Alegreya Sans',sans-serif;color:#3d342b;white-space:nowrap;cursor:help}
.pg-stage .pg-blot{position:absolute;right:-12px;top:0;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45));z-index:3}
.pg-stage .pg-sea-veil,.pg-stage .pg-sea-wave,.pg-stage .pg-sea-ghost{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden;border-radius:5px}
.pg-stage .pg-sea-veil{background:linear-gradient(180deg,rgba(70,140,160,.28),rgba(36,82,100,.55))}
.pg-stage .pg-caustic{position:absolute;left:0;top:0;animation:pgcaus 9s linear infinite}
@keyframes pgcaus{to{transform:translateX(-478px)}}
.pg-stage .mat.pg-under-deep{transform:rotate(.25deg) translateY(3px)!important;filter:saturate(.7)}
.pg-stage .mat.pg-under-deep .mh > span:first-child svg{transform:translateY(3px)}
.pg-stage .pg-sea-wave svg{position:absolute;left:0;top:0;width:100%;height:100%}
.pg-stage .mat.pg-under-wave .mh > span:first-child svg{transform:translateY(9px);opacity:.55}
.pg-stage .mat.pg-under-wave .body{filter:saturate(.6) brightness(.95)}
.pg-stage .mat.pg-under-ghost{filter:saturate(.45) brightness(.92);opacity:.8;box-shadow:0 0 0 1.5px rgba(120,220,180,.5),0 0 22px rgba(90,210,170,.45),0 12px 20px rgba(0,0,0,.45)!important}
.pg-stage .pg-sea-ghost{background:linear-gradient(180deg,rgba(90,200,160,.18),rgba(40,130,100,.38))}
.pg-stage .pg-weeds{position:absolute;pointer-events:none;z-index:1;overflow:visible}
.pg-stage .pg-weed{animation:pgweed 3.6s ease-in-out infinite alternate}
@keyframes pgweed{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.pg-stage .pg-bub{position:absolute;bottom:-6px;border-radius:50%;border:1px solid rgba(220,244,248,.85);background:rgba(220,244,248,.18);animation:pgbub 3.2s ease-in infinite}
@keyframes pgbub{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-110px) scale(1.1);opacity:0}}
.pg-stage .pg-sea-lbl{position:absolute;right:10px;bottom:7px;padding:1px 9px;border-radius:9px;background:rgba(20,52,66,.82);color:#e6f4f8;font:700 11px/1.5 'Alegreya Sans',sans-serif;letter-spacing:.04em}
.pg-stage .mat.pg-surf{box-shadow:0 0 0 2px #9cc4d4,0 1px 0 #c9b48c,0 12px 20px rgba(0,0,0,.45)}
.pg-stage .mat.pg-sunk{filter:grayscale(.85) brightness(.82)}
.pg-stage .mat.pg-sunk .mh > span:first-child svg{transform:translateY(9px) rotate(16deg)}
.pg-stage .mat.pg-sunk .rows{opacity:.55}
.pg-stage .leg.pg-medal{background:none!important;box-shadow:none!important;width:28px!important;height:28px!important;filter:drop-shadow(0 1px 1.6px rgba(0,0,0,.55))}
.pg-stage .pg-medal .gl{animation:pgmglint 6s ease-in-out infinite}
@keyframes pgmglint{0%,72%{transform:translateX(-24px) skewX(-22deg)}88%,100%{transform:translateX(24px) skewX(-22deg)}}
.pg-stage .pg-char{position:absolute;left:0;right:0;bottom:0;height:62%;pointer-events:none;z-index:3;border-radius:0 0 6px 6px;background:linear-gradient(to bottom,rgba(40,16,4,0),rgba(60,24,6,.28) 45%,rgba(26,10,2,.62));mix-blend-mode:multiply}
.pg-stage .pg-breakedge{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:8;overflow:visible}
.pg-stage .pg-hitmark{position:absolute;z-index:8;pointer-events:none;border-radius:50%;background:radial-gradient(ellipse,rgba(20,10,4,.75),rgba(60,26,8,.35) 45%,transparent 70%);mix-blend-mode:multiply}
.pg-stage .fan.pg-fan{gap:0;font-size:0}
.pg-stage .fan.pg-fan svg{display:block}
.pg-stage .pg-tseal{position:relative;display:inline-block;width:30px;height:24px;margin-right:4px;flex:none;z-index:6}
.pg-stage .pg-tseal svg{position:absolute;left:-7px;top:-8px;transform-origin:22px 20px;filter:drop-shadow(0 1.5px 1.2px rgba(0,0,0,.45));overflow:visible}
.pg-stage .pg-tseal .tails{transform-origin:0 4px}
.pg-stage .pg-sinkwater{position:absolute;inset:0;pointer-events:none;z-index:9;background:linear-gradient(to bottom,rgba(10,40,52,0) 0%,rgba(14,52,66,.55) 45%,rgba(6,24,32,.9) 100%);background-size:100% 220%;border-radius:6px}
.pg-stage .pg-stamp{position:absolute;left:150px;top:52px;transform:rotate(-7deg);padding:2px 14px;border:3px double #8e2b22;border-radius:4px;color:#8e2b22;font:700 22px/1.1 'Old Standard TT',serif;letter-spacing:.22em;text-transform:uppercase;opacity:.85;pointer-events:none;mix-blend-mode:multiply}
.pg-stage .pg-deck{position:absolute;inset:0;z-index:70;background:radial-gradient(ellipse at 50% 45%,rgba(20,10,4,.45),rgba(20,10,4,.78));display:flex;align-items:center;justify-content:center}
.pg-stage .pg-deck-in{width:1240px;padding:10px 18px 14px;background:linear-gradient(90deg,#d9c7a0,#efe3c8 4%,#f3e8cf 96%,#d9c7a0);border-radius:4px;box-shadow:0 20px 40px rgba(0,0,0,.6),inset 0 0 0 1.5px #2a2521,inset 0 0 0 4px #efe3c8,inset 0 0 0 5px #8a7550}
.pg-stage .pg-deck-h{display:flex;align-items:baseline;gap:14px;font:700 18px/1 'Old Standard TT',serif;letter-spacing:.14em;text-transform:uppercase;color:#2a2521;padding:2px 4px 8px;border-bottom:2px solid #8e2b22;margin-bottom:10px}
.pg-stage .pg-deck-h span{font:500 13px 'Alegreya Sans',sans-serif;letter-spacing:0;text-transform:none;color:#6b6157}
.pg-stage .pg-deck-x{margin-left:auto;width:30px;height:30px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ead07c,#8f6b20 80%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.3);font:700 14px 'Alegreya Sans';color:#22180c;cursor:pointer}
.pg-stage .pg-deck-g{display:grid;grid-template-columns:repeat(9,1fr);gap:10px 10px;justify-items:center}
.pg-stage .card.pg-sea{position:relative;height:226px;border:0;padding:0;text-align:left;cursor:pointer;transition:transform .15s;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.pg-stage .card.pg-sea:hover,.pg-stage .card.pg-sea:focus-visible{transform:translateY(-6px) scale(1.04);outline:none}
.pg-stage .card.pg-sea.pg-cur{box-shadow:0 0 0 2.5px #e0bd62,0 0 16px rgba(255,196,120,.6),0 8px 14px rgba(0,0,0,.5)}
.pg-stage .pg-wx{display:flex;justify-content:center;padding:4px 0 0}
/* the parts of the weather drawings move: a preview of the sea-card animation (hover a card in the deck) */
.pg-stage .pg-sea [data-a]{transform-box:fill-box;transform-origin:center}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="ship"]{animation:wxbob 2.6s ease-in-out infinite}
.pg-stage :is(.pg-sea[data-k="calm"]:hover,.pg-live[data-k="calm"]) [data-a="ship"]{animation:wxbob 5s ease-in-out infinite}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="sail"]{animation:wxfill 2.6s ease-in-out infinite}
.pg-stage :is(.pg-sea[data-k="calm"]:hover,.pg-live[data-k="calm"]) [data-a="sail"]{animation:none}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="flag"]{animation:wxflag .5s ease-in-out infinite alternate;transform-origin:left center}
.pg-stage :is(.pg-sea[data-k="calm"]:hover,.pg-live[data-k="calm"]) [data-a="flag"]{animation:none}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="sun"],.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="halo"]{animation:wxglow 2.4s ease-in-out infinite}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="rays"]{animation:wxspin 18s linear infinite}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="glint"],.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="road"],.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="stars"]{animation:wxglint 1.6s ease-in-out infinite}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="gust"]{animation:wxgust 1.4s ease-in-out infinite}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="wave"]{animation:wxwave 2.2s ease-in-out infinite}
/* fog: the banks drift apart and back, the ghost ship comes and goes */
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="fogL"]{animation:wxfogL 4.5s ease-in-out infinite alternate}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="fogR"]{animation:wxfogR 4.5s ease-in-out infinite alternate}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="ghost"]{animation:wxghost 4.5s ease-in-out infinite alternate}
/* storm and thunder: the rain falls, the cloud flashes with the bolt */
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="rain"]{animation:wxrain .7s linear infinite}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="bolt"],.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="spark"]{animation:wxbolt 2s steps(1) infinite}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="cloud"]{animation:wxflash 2s steps(1) infinite}
/* the great wave rears, its spray flies */
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="crest"]{animation:wxcrest 2.8s ease-in-out infinite;transform-origin:left bottom}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="spray"]{animation:wxspray 1.4s ease-out infinite}
/* the maelstrom draws everything in: the foam streams run to the eye, the eye deepens, the plank spirals down and is gone */
.pg-stage .pg-sea [data-a="suck"]{stroke-dasharray:7 4}
.pg-stage .pg-sea [data-a="suck2"]{stroke-dasharray:4 3}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="suck"]{animation:wxsuck 1.6s linear infinite}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="suck2"]{animation:wxsuck2 1s linear infinite}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="eye"]{animation:wxeye 1.6s ease-in-out infinite}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="plank"]{animation:wxdown 3.2s cubic-bezier(.5,0,.9,.6) infinite}
/* mermaids: the tail sways out of the water; tortuga: palms sway, lights flicker */
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="tail"]{animation:wxtail 2.4s ease-in-out infinite;transform-origin:center bottom}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="drops"]{animation:wxdrop 1.2s ease-in infinite}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="frond"],.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="frond2"]{animation:wxfrond 2.2s ease-in-out infinite alternate;transform-origin:center bottom}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="window"],.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="lamp"]{animation:wxflick .9s ease-in-out infinite alternate}
/* rum: the bottle bobs, bubbles rise; wet: drops fall, the puddle spreads */
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="bob"]{animation:wxbottle 2.2s ease-in-out infinite}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="bubbles"]{animation:wxrise 1.8s ease-out infinite}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="puddle"]{animation:wxpuddle 1.2s ease-in-out infinite}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="foam"]{animation:wxfoam 1.3s ease-in-out infinite}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="drift"]{animation:wxbob 2.4s ease-in-out infinite}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="coins"]{animation:wxhop 1.2s ease-in-out infinite}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="ships"]{animation:wxsail 4s ease-in-out infinite alternate}
/* current: the two streams run against each other and carry the ships */
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="flowR"],.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="flowL"]{animation:wxflow .8s linear infinite}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="rideR"]{animation:wxrideR 2.4s ease-in-out infinite alternate}
.pg-stage :is(.pg-sea:hover,.pg-live) [data-a="rideL"]{animation:wxrideL 2.4s ease-in-out infinite alternate}
@keyframes wxbob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1px) rotate(-1.6deg)}}
@keyframes wxfill{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.07)}}
@keyframes wxflag{from{transform:skewY(0)}to{transform:skewY(-14deg)}}
@keyframes wxglow{0%,100%{opacity:1}50%{opacity:.72}}
@keyframes wxspin{to{transform:rotate(360deg)}}
@keyframes wxglint{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes wxgust{0%{transform:translateX(-2.5px);opacity:.2}40%{opacity:1}100%{transform:translateX(3px);opacity:.2}}
@keyframes wxwave{0%,100%{transform:translateX(0)}50%{transform:translateX(-1.6px)}}
@keyframes wxfogL{from{transform:translateX(0)}to{transform:translateX(-2.5px)}}
@keyframes wxfogR{from{transform:translateX(0)}to{transform:translateX(2.5px)}}
@keyframes wxghost{from{opacity:.42}to{opacity:.12}}
@keyframes wxrain{from{transform:translate(0,-1.6px);opacity:.4}50%{opacity:1}to{transform:translate(-.8px,2px);opacity:.4}}
@keyframes wxbolt{0%,58%,74%,100%{opacity:1}60%,66%{opacity:.08}68%,72%{opacity:1}}
@keyframes wxflash{0%,58%,100%{filter:none}60%,66%{filter:brightness(1.7)}}
@keyframes wxcrest{0%,100%{transform:skewX(0) scaleY(1)}50%{transform:skewX(-4deg) scaleY(1.03)}}
@keyframes wxspray{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(1.5px,-2.5px);opacity:0}}
@keyframes wxsuck{to{stroke-dashoffset:22}}
@keyframes wxsuck2{to{stroke-dashoffset:14}}
@keyframes wxeye{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@keyframes wxdown{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}28%{transform:translate(-9px,1.6px) rotate(-100deg) scale(.86)}55%{transform:translate(-12px,7px) rotate(-220deg) scale(.6)}78%{transform:translate(-9.4px,9.6px) rotate(-330deg) scale(.32);opacity:.85}100%{transform:translate(-8px,8.4px) rotate(-430deg) scale(0);opacity:0}}
@keyframes wxtail{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes wxdrop{0%{transform:translateY(-1px);opacity:0}30%{opacity:1}100%{transform:translateY(2px);opacity:0}}
@keyframes wxfrond{from{transform:rotate(-3deg)}to{transform:rotate(4deg)}}
@keyframes wxflick{from{opacity:1}to{opacity:.55}}
@keyframes wxbottle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1.4px) rotate(5deg)}}
@keyframes wxrise{0%{transform:translateY(1px);opacity:0}30%{opacity:1}100%{transform:translateY(-3px);opacity:0}}
@keyframes wxpuddle{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.08)}}
@keyframes wxfoam{0%,100%{transform:scaleY(1);opacity:1}50%{transform:scaleY(1.35);opacity:.65}}
@keyframes wxhop{0%,100%{transform:translateY(0)}40%{transform:translateY(-1.6px)}}
@keyframes wxsail{from{transform:translateX(-1.5px)}to{transform:translateX(1.5px)}}
@keyframes wxflow{to{stroke-dashoffset:-6}}
@keyframes wxrideR{from{transform:translate(-2px,-.6px)}to{transform:translate(2.4px,1px)}}
@keyframes wxrideL{from{transform:translate(2px,.6px)}to{transform:translate(-2.4px,-1px)}}
.pg-stage .card.pg-sea .n{padding-top:2px}
.pg-stage .pg-banner{position:absolute;left:532px;top:258px;z-index:30;padding:8px 54px;background:linear-gradient(#a8382c,#7e2219);clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%);box-shadow:0 6px 14px rgba(0,0,0,.5);color:#f6e7c6;font:700 30px/1.1 'Old Standard TT',serif;letter-spacing:.24em;text-transform:uppercase;white-space:nowrap}

<script>
"use strict";
const stage = document.getElementById('stage'), scaler = document.getElementById('scaler'), wrap = document.getElementById('wrap');
const HINTS = {
  A5Table: '<b>Стол, ваш ход.</b> Наведите на карту — она выпрямится и подрастёт; нажмите — откроется крупно. <b>«Залп» у «Жемчужины»</b> — Залп по «Голландцу» с Зарядом «Ядра». Справа внизу: Быстрее, До конца, Пауза (пока идёт показ) и Отменить. «Ход окончен» — ход Компании и «Тревога!». В журнале наведите на подсвеченное название карты — она покажется.',
  A5Alarm: '<b>«Тревога!»</b> — Залп «Индевора» по «Жемчужине». Реакции подняты из руки; нажмите на карту, чтобы рассмотреть. «Свернуть, посмотреть стол» — стол без затемнения, «Пропустить» — обратно к столу.',
  A5Volley: '<b>Залп</b> «Жемчужины» по «Голландцу» — живой. «Ядра» уходят в Заряд, табличка-разбор в проходе, дым у борта, три ядра: два не долетают («Буря −1», «Диагональ −1»), одно ломает доску Корпуса. «Отменить» справа внизу — вернуть ход.',
  A5Status: '<b>Статусы.</b> «Индевор»: 2 Пожара, «Чёрная метка» (клякса на рисунке корабля), Блокада. «Жемчужина»: Без Реакций, Кукла вуду. «Голландец» под водой — нельзя выбрать целью. «Месть» потоплена. Наведите на значок — подсказка из игры. Сравните «Жетоны в шапке» и «Ярлыки у Корпуса».',
  A5Weather: '<b>Погода.</b> Значки всех 17 карт моря. Нажмите на карту — она станет картой раунда в плашке справа вверху; на плашку можно нажать в любой сцене, колода откроется снова.',
  A5Round: '<b>Начало раунда.</b> Баннер, карта моря выходит рубашкой и переворачивается, улетает в плашку и делает своё. <b>Карты «весь раунд» остаются на море до конца раунда:</b> Буря — ливень и зарницы, Мальстрём — воронка затягивает обломки, Туман — полосы тумана и перечёркнутые диагонали, Девятый вал — валы катятся по морю, Штиль, Ветер, Ясное небо, Луна, Рифы, Флот. <b>Карты «сразу»:</b> Гроза бьёт молнией в Паруса (они потом тлеют), Русалки утаскивают матроса, Ром — бутылка и пробка, Караван — корабль бросает бочонки в Трюмы, Сырой порох — туча над Трюмами и лужа, Тортуга — фонари, Течение — потоки несут корабли.',

function show(name, opts = {}){
  if(name === 'A5Volley' && !opts.frame){ show('A5Table'); cur = 'A5Volley'; marksTabs(); document.getElementById('hint').innerHTML = HINTS.A5Volley; setTimeout(() => volley(), 350); return; }
  stopVolley();
  cur = name; sel = null;
  collapsed = !!opts.collapsed;
  const sc = SCENES[name] || SCENES.A5Table;
  stage.innerHTML = `<style>${SCENES.A5Table.style}</style>${sc.body}`;
  { const r = stage.querySelector(':scope > div');
    if(r) [...r.children].forEach(el => { const st = el.getAttribute('style') || '';
      if(st.includes('left:383px;top:7px')) el.dataset.pg = 'instr';
      else if(st.includes('right:118px;top:6px')) el.dataset.pg = 'sea';
      else if(st.includes('left:14px;top:9px;height:34px')) el.dataset.pg = 'round';

  if(root0){ applyFrame(root0); journal(root0); legMedals(root0); handFans(root0); companyHold(root0); cardFont(); applyWeather(root0); if(name !== 'A5Round') applyRoundWeather(root0, seaKey);
    if(name === 'A5Status') applyStatuses(root0);
    if(name === 'A5Weather') setTimeout(() => openSeaDeck(root0), 60);
    if(name === 'A5Round') setTimeout(() => playRound(), 400);
    // the round plaque: the capitals with letter-spacing sat a little left and high — centre them
    const plq = root0.querySelector('[data-pg="round"]');
    if(plq){ plq.style.padding = '2px 12px 0 16px'; plq.style.justifyContent = 'center'; } }

    // «Свернуть»: the same moment of the game, the dark layer, the banner, the shot line and the choice put away

    [...root.children].forEach(el => {
      const st = el.getAttribute('style') || '';
      if(/z-index:\s*(5|7)\b/.test(st) && !el.classList.contains('mat') && !el.classList.contains('card')) el.style.display = 'none';
      if(el.tagName.toLowerCase() === 'svg' && /z-index:\s*6/.test(st)) el.style.display = 'none';
      if(el.textContent.includes('Пропустить')) el.style.display = 'none';
    });
    root.querySelectorAll('[style*="visibility:hidden"]').forEach(el => el.style.visibility = 'visible');
    const instr = root.querySelector('[data-pg="instr"]');
    if(instr) instr.textContent = '«Индевор» даёт Залп по «Жемчужине»';
    const pill = document.createElement('button');
    pill.className = 'pg-pill'; pill.type = 'button';

  }
  marksTabs();
  document.getElementById('hint').innerHTML = HINTS[name];
}

/* the controls of the artboard, found by their own text: nothing is added to the markup */
function byText(sel, text){ return [...stage.querySelectorAll(sel)].filter(e => e.textContent.replace(/\s+/g, ' ').trim().startsWith(text)); }
function clickable(el, fn){ if(!el) return; el.classList.add('pg-click'); el.addEventListener('click', e => { e.stopPropagation(); fn(); }); }

function wire(){
  const root = stage.querySelector(':scope > div');
  if(!root) return;
  // cards of the hand: hover — straight, up, a little bigger; click — open large
  const scene = cur;
  if(scene !== 'A5Victory'){
    root.querySelectorAll(':scope > .card').forEach(c => {
      c.dataset.base = c.style.transform || 'none';
      c.tabIndex = 0;
      const lift = () => { if(c.classList.contains('pg-sel')) return; c.classList.add('pg-hover'); c.style.transform = 'translateY(-26px) rotate(0deg) scale(1.12)'; };
      const drop = () => { if(c.classList.contains('pg-sel')) return; c.classList.remove('pg-hover'); c.style.transform = c.dataset.base; };
      c.addEventListener('mouseenter', lift); c.addEventListener('mouseleave', drop);
      c.addEventListener('focus', lift); c.addEventListener('blur', drop);
      c.addEventListener('click', e => { e.stopPropagation(); select(c); });
      c.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); select(c); } });
    });
  }
  if(scene === 'A5Status' || scene === 'A5Weather' || scene === 'A5Round' || scene === 'A5Fx'){ playControls(root); clickable(byText('button', 'Ход окончен')[0], () => show('A5Alarm')); }
  if(scene === 'A5Table'){
    const pearl = [...root.querySelectorAll('.mat')].find(m => m.textContent.includes('Чёрная жемчужина'));
    VB = pearl && [...pearl.querySelectorAll('.cmd')].find(b => b.textContent.includes('Залп'));
    clickable(VB, () => volley());
    playControls(root);
    clickable(byText('button', 'Ход окончен')[0], () => show('A5Alarm'));
  }
  if(scene === 'A5Alarm'){
    clickable(byText('button', 'Пропустить')[0], () => show('A5Table'));
    if(!collapsed) clickable(byText('button', 'Свернуть')[0], () => show('A5Alarm', {collapsed: true}));
  }

  if(scene === 'A5Victory'){
    ['Реванш', 'Новая партия', 'Посмотреть стол'].forEach(t => clickable(byText('button', t)[0], () => show('A5Table')));
  }
  root.addEventListener('click', () => { if(sel) unselect(); });
}
function select(c){
  if(sel && sel !== c) unselect();
  if(sel === c){ unselect(); return; }
  sel = c; c.classList.remove('pg-hover'); c.classList.add('pg-sel');
  c.style.transform = 'translateY(-70px) rotate(0deg) scale(1.38)';
}
function unselect(){ if(!sel) return; sel.classList.remove('pg-sel'); sel.style.transform = sel.dataset.base; sel = null; }

function applyWeather(root){
  const plq = root.querySelector('[data-pg="sea"]');

  const w = plq.querySelector(':scope > div'), txt = w && w.children[0], big = w && w.children[1];

  plq.classList.add('pg-click'); plq.title = `${c[1]} — ${c[4].replace(/<[^>]+>/g, '')} Нажмите — колода моря`;
  plq.onclick = e => { e.stopPropagation(); openSeaDeck(root); };
}
/* the sea deck: all 17 sea cards in the manner of the A5 cards; a click puts the card into the plaque */
function openSeaDeck(root){
  if(root.querySelector('.pg-deck')) return;
  const d = document.createElement('div'); d.className = 'pg-deck';
  d.innerHTML = `<div class="pg-deck-in"><div class="pg-deck-h">Колода моря <span>17 карт · нажмите на карту — она станет картой раунда</span><button type="button" class="pg-deck-x" aria-label="Закрыть">✕</button></div><div class="pg-deck-g">${SEA.map(([k, n, w, b, x]) => `

  root.appendChild(d);
  d.addEventListener('click', e => { e.stopPropagation(); const c = e.target.closest('.pg-sea'); if(c){ seaKey = c.dataset.k; d.remove(); applyWeather(root); return; } if(e.target.closest('.pg-deck-x') || e.target === d) d.remove(); });

let stView = 'tags', dutchState = 'under', underView = 'deep';
/* «Голландец» под водой — three looks */
function underWater(m){
  m.classList.add('pg-under', 'pg-under-' + underView);
  const W = 478, H = m.offsetHeight || 112;
  const bubbles = n => Array.from({length: n}, (_, i) => `<i class="pg-bub" style="left:${30 + i * (W - 60) / (n - 1) + (i % 2 ? 9 : -6)}px;animation-delay:${(i * .73) % 3.2}s;width:${3 + (i % 3) * 1.6}px;height:${3 + (i % 3) * 1.6}px"></i>`).join('');
  if(underView === 'deep'){
    // the whole plank lies under a layer of sea: light ripples run across it, bubbles go up
    m.insertAdjacentHTML('beforeend', `<div class="pg-sea-veil"><svg class="pg-caustic" width="${W * 2}" height="${H}" viewBox="0 0 ${W * 2} ${H}" aria-hidden="true">${Array.from({length: 7}, (_, r) => `<path d="M0 ${12 + r * 15} ${Array.from({length: 24}, (_, i) => `q10 ${(i + r) % 2 ? -5 : 5} 20 0 t20 0`).join(' ')}" fill="none" stroke="rgba(214,240,246,${r % 2 ? .22 : .32})" stroke-width="${r % 2 ? 1 : 1.6}"/>`).join('')}</svg>${bubbles(7)}</div>`);
  }
  if(underView === 'wave'){
    // a wave washes over the head of the plank; the ship sank under its crest
    let d = `M0 18`; for(let x = 0; x < W; x += 40) d += ` C${x + 10} 6 ${x + 24} 6 ${x + 30} 14 C${x + 33} 18 ${x + 37} 17 ${x + 40} 15`;
    m.insertAdjacentHTML('beforeend', `<div class="pg-sea-wave"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} V${H} H0 Z" fill="rgba(47,95,116,.5)"/><path d="${d}" fill="none" stroke="#eef6f8" stroke-width="2.2" stroke-linecap="round"/>${Array.from({length: 12}, (_, i) => `<path d="M${18 + i * 40} ${40 + (i % 3) * 18} q5 -4 10 0 q5 4 10 0" fill="none" stroke="rgba(214,240,246,.45)" stroke-width="1.3" stroke-linecap="round"/>`).join('')}</svg>${bubbles(5)}</div>`);
  }
  if(underView === 'ghost'){
    // the ghost ship deep down: sea-green and pale, a glow of the deep, weed hanging from the plank
    const weed = Array.from({length: 9}, (_, i) => { const x = 20 + i * 54 + (i % 2) * 12, h = 14 + (i % 3) * 8; return `<path class="pg-weed" style="animation-delay:${i * .4}s;transform-origin:${x}px ${H}px" d="M${x} ${H} C${x - 5} ${H + h * .4} ${x + 5} ${H + h * .7} ${x} ${H + h}" fill="none" stroke="#3f7a5a" stroke-width="2.2" stroke-linecap="round"/>`; }).join('');
    m.insertAdjacentHTML('beforeend', `<div class="pg-sea-ghost">${bubbles(6)}</div>`);
    m.insertAdjacentHTML('afterend', `<svg class="pg-weeds" width="${W}" height="40" viewBox="0 ${H} ${W} 40" style="left:${m.style.left};top:${parseFloat(m.style.top) + H - 2}px" aria-hidden="true">${weed}</svg>`);
  }
}
const STATUS_OF = () => ({
  'Индевор': [['fire', 2], ['mark', 2], ['blockade']],
  'Чёрная жемчужина': [['noReact'], ['voodoo']],
  'Летучий голландец': [[dutchState]],
  'Месть королевы Анны': [],
});
function applyStatuses(root){
  const mats = [...root.querySelectorAll('.mat')];
  const by = n => mats.find(m => m.textContent.includes(n));
  Object.entries(STATUS_OF()).forEach(([name, list]) => {
    const m = by(name); if(!m) return;
    if(!list.length) return;
    if(stView === 'tokens'){
      const r = m.querySelector('.mh .r');
      const box = document.createElement('span'); box.className = 'pg-toks';
      box.innerHTML = list.map(([k, n]) => { const s = ST[k]; return `<span class="pg-tok ${k === 'fire' ? 'pg-fire' : ''}" title="${s.lbl(n)} — ${s.hint}" tabindex="0"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">${ST2[k]}</svg>${n ? `<b>${n}</b>` : ''}</span>`; }).join('');
      r && r.prepend(box);
    } else {
      // two tags at the Hull, the rest at the end of the second row (a long Hull leaves room for two)
      const rows = m.querySelectorAll('.row');
      const tag = ([k, n]) => { const s = ST[k]; return `<span class="pg-tag ${k === 'fire' ? 'pg-fire' : ''}" title="${s.hint}" tabindex="0"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">${ST2[k]}</svg>${s.lbl(n)}</span>`; };
      [list.slice(0, 2), list.slice(2)].forEach((part, i) => { if(!part.length || !rows[i]) return;
        const box = document.createElement('span'); box.className = 'pg-tags'; box.innerHTML = part.map(tag).join(''); rows[i].appendChild(box); });
    }
    // the black mark: the blot stamped on the drawing of the ship
    if(list.some(([k]) => k === 'mark')){ const sb = m.querySelector('.mh > span'); if(sb){ sb.style.position = 'relative'; sb.style.overflow = 'visible'; sb.insertAdjacentHTML('beforeend', `<svg class="pg-blot" width="30" height="30" viewBox="-1 -2.5 29 29" aria-hidden="true">${MARK_PIN.replace('@@MARK@@', ST2.mark)}</svg>`); } }
    // under water: the plank goes under the sea — a waterline, blue water over the body, the ship lower in its frame
    if(list.some(([k]) => k === 'under')) underWater(m);
    if(list.some(([k]) => k === 'surfaced')) m.classList.add('pg-surf');
  });
  // sunk: «Месть» lies on the bottom — grey, the ship down in its frame, the ink stamp «Потоплен»
  const rv = by('Месть королевы Анны');
  if(rv){
    rv.classList.add('pg-sunk');
    rv.querySelectorAll('.row b').forEach(b => { b.textContent = b.textContent.replace(/^\d+/, '0'); });
    const act = rv.querySelector('.act'); if(act) act.style.display = 'none';
    rv.querySelectorAll('.mh .r > *').forEach(el => { if(el.textContent.includes('готов')) el.style.display = 'none'; });
    rv.insertAdjacentHTML('beforeend', '<div class="pg-stamp" title="Капитан на борту союзника: 1 карта и 1 Реакция за ход за союзника">Потоплен</div>');
    const gold = rv.querySelector('.mh .r'); if(gold) gold.insertAdjacentHTML('afterbegin', `<span class="pg-tok" title="Утонул — капитан на борту «Жемчужины»: 1 карта и 1 Реакция за ход за союзника" tabindex="0"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">${ST2.sunk}</svg></span>`);
  }
  // the instruction says what this screen is
  const instr = root.querySelector('[data-pg="instr"]');
  if(instr) instr.textContent = 'Статусы кораблей — наведите на значок';
  root.classList.add('pg-st');
}

/* A small detailed ship for the weather icons. Origin — the middle of the waterline; length ≈ 26, height ≈ 22 (scale 1).
   o.sails: 'full' (bellied by the wind) | 'slack' (hanging in folds) | 'square' (merchant, flat) | 'ghost' (grey, no detail)
   o.heel: degrees; o.flip: true — the bow to the left; o.hull, o.sail, o.flag: colours; o.ports: gunports on/off.
   Parts carry data-a for animation: data-a="ship" (the whole, to bob), "sail" (each sail, to fill), "flag" (to flutter). */
function SHIP(o = {}){
  const k = o.scale || 1, ink = o.ink || '#22190f';
  const hull = o.hull || '#8a5a32', dark = o.hullDark || '#5a3a1c', light = o.hullLight || '#b07a48';
  const sail = o.sail || '#f4ecd8', seam = o.seam || '#c9b48a', flag = o.flag || '#8e2b22';
  const ghost = o.sails === 'ghost';
  const sw = (w) => (w / Math.max(k, .6)).toFixed(2);
  let g = '';
  // rigging (behind the sails)
  if(!ghost) g += `<path d="M-7 -12.6 L-12.6 -5.2 M-1 -18 L-12 -5.4 M-1 -18 L11 -4.6 M5 -15.4 L17.6 -7.6 M5 -15.4 L12 -4.4" stroke="${ink}" stroke-width="${sw(.25)}" fill="none" opacity=".75"/>`;
  // masts
  g += `<path d="M-7 -4.6 V-12.8 M-1 -4.6 V-18.6 M5 -4.4 V-15.8" stroke="${ghost ? '#6b7078' : ink}" stroke-width="${sw(.8)}" stroke-linecap="round"/>`;
  // sails
  const sq = (x, top, w, h, belly) => {
    const l = x - w / 2, r = x + w / 2, b = top + h;
    if(o.sails === 'slack') return `<path data-a="sail" d="M${l} ${top} H${r} Q${r + .4} ${top + h * .4} ${r - .3} ${top + h * .55} Q${r + .3} ${top + h * .8} ${r - .4} ${b} H${l + .4} Q${l - .3} ${top + h * .8} ${l + .3} ${top + h * .55} Q${l - .4} ${top + h * .4} ${l} ${top} Z" fill="${sail}" stroke="${ink}" stroke-width="${sw(.45)}" stroke-linejoin="round"/><path d="M${x - w * .2} ${top + .4} Q${x - w * .26} ${top + h * .5} ${x - w * .18} ${b - .3} M${x + w * .18} ${top + .4} Q${x + w * .24} ${top + h * .5} ${x + w * .16} ${b - .3}" fill="none" stroke="${seam}" stroke-width="${sw(.35)}"/>`;
    const bl = belly || 0;
    return `<path data-a="sail" d="M${l} ${top} H${r} Q${r + bl * .5} ${top + h / 2} ${r} ${b} Q${x + bl} ${b + bl * .55} ${l} ${b} Q${l + bl * .5} ${top + h / 2} ${l} ${top} Z" fill="${ghost ? '#d7dadd' : sail}" stroke="${ghost ? '#8a8f96' : ink}" stroke-width="${sw(.45)}" stroke-linejoin="round"/>${ghost ? '' : `<path d="M${l + .4} ${top + h * .5} Q${x + bl * .6} ${top + h * .5 + bl * .3} ${r - .4} ${top + h * .5}" fill="none" stroke="${seam}" stroke-width="${sw(.35)}"/><path d="M${x + w * .12} ${top + .3} Q${x + w * .2 + bl * .5} ${top + h * .55} ${x + w * .1} ${b + bl * .3}" fill="none" stroke="${seam}" stroke-width="${sw(.3)}" opacity=".8"/>`}`;
  };
  const bel = o.sails === 'full' ? 1.6 : o.sails === 'square' ? .5 : .8;
  g += sq(-1, -17.4, 8.4, 5.4, bel) + sq(-1, -11.4, 9.6, 5.6, bel);
  g += sq(5, -14.8, 6.8, 4.4, bel) + sq(5, -9.8, 7.8, 4.6, bel);
  g += sq(-7, -12.2, 5.6, 6.2, bel * .8);
  if(!ghost && o.sails !== 'slack') g += `<path data-a="sail" d="M5.6 -15 L16.6 -7.4 L9.6 -6.6 Z" fill="${sail}" stroke="${ink}" stroke-width="${sw(.4)}" stroke-linejoin="round"/>`;
  // flag at the main top
  if(!ghost) g += o.sails === 'slack'
    ? `<path data-a="flag" d="M-1 -18.6 L.6 -18.2 L.4 -15 L-.2 -15.8 L-1 -15.2 Z" fill="${flag}"/>`
    : `<path data-a="flag" d="M-1 -18.6 Q2 -19.4 4.4 -18.2 Q2.4 -17.6 4.4 -16.8 Q1.6 -16.2 -1 -17 Z" fill="${flag}"/>`;
  // hull: stern castle, sheer, bow and bowsprit; a wale and a row of gunports
  g += `<path d="M-13 -7.6 H-8 L-7.4 -5.2 L8.6 -4.8 Q11.6 -5.2 13 -6.8 L13.6 -5.6 Q12.6 -2 9.6 -.6 Q4 .6 -6 .4 Q-10.4 .2 -11.8 -1.6 Z" fill="${ghost ? '#8a8f96' : hull}" stroke="${ghost ? '#6b7078' : ink}" stroke-width="${sw(.6)}" stroke-linejoin="round"/>`;
  if(!ghost){
    g += `<path d="M-12.4 -3.6 Q-2 -2.6 12.4 -3.8" fill="none" stroke="${light}" stroke-width="${sw(.7)}"/><path d="M-11.8 -1.6 Q-4 -.6 9.6 -.6" fill="none" stroke="${dark}" stroke-width="${sw(.8)}"/>`;
    if(o.ports !== false) for(let x = -8; x <= 8; x += 2.6) g += `<rect x="${x.toFixed(1)}" y="-3.1" width="1.1" height=".9" fill="${ink}"/>`;
    g += `<path d="M-12.6 -7.2 H-8.4" stroke="${light}" stroke-width="${sw(.5)}"/><rect x="-12.2" y="-6.6" width=".9" height=".9" fill="#f2c94c" opacity=".9"/><rect x="-10.6" y="-6.6" width=".9" height=".9" fill="#f2c94c" opacity=".9"/>`;
    g += `<path d="M12.8 -6.4 L18.2 -8.4" stroke="${ink}" stroke-width="${sw(.6)}" stroke-linecap="round"/>`;
  }
  const t = `translate(${o.x || 0} ${o.y || 0}) rotate(${o.heel || 0}) scale(${o.flip ? -k : k} ${k})`;
  return `<g data-a="ship"><g transform="${t}">${g}</g></g>`;
}

    if(kind === 'caravan'){ fill(pkegs, 2, 2); fill(ckegs, COMPANY_POWDER, 2); markAt(root, 110, 550, '+2 Пороха', true); markAt(root, 318, 34, '+2 Пороха', true); recount(4, COMPANY_POWDER + 2); }
    else { empty(pkegs, 2, 1); empty(ckegs, COMPANY_POWDER, 2); markAt(root, 110, 550, '−1 Порох'); markAt(root, 318, 34, '−2 Пороха'); recount(1, COMPANY_POWDER - 2); }
    await done(2200); return;
  }
  if(kind === 'mermaids' || kind === 'rum'){
    // crew: every ship with 3+ loses one (mermaids) — every ship mends one (rum)
    for(const m of mats){
      const cr = cellsOf(m, 'команда'), num = numOf(m, 'команда'); if(!cr.length || !num) continue;
      const v = parseInt(num.textContent, 10), max = cr.length;
      if(kind === 'mermaids' && v >= 3){ swapIcon(cr[v - 1], CELLS2.CREW_X); setNum(num, v - 1); const b = rootBox(root, num); markAt(root, b.x + 26, b.cy, '−1'); }

      await vwait(260);

    const best = tops.filter(t => t.v === tops[0].v);

      const sb = rootBox(root, m.querySelector('.mh > span'));

      bolt.innerHTML = `<svg width="60" height="${sb.cy - 10}" viewBox="0 0 60 ${sb.cy - 10}" aria-hidden="true"><path d="M34 0 L22 ${(sb.cy - 10) * .45} H32 L18 ${sb.cy - 10} L42 ${(sb.cy - 10) * .38} H31 L44 0 Z" fill="#f2c94c" stroke="#7a5a10" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
      bolt.style.left = (sb.cx - 30) + 'px'; root.appendChild(bolt);
      A(bolt, [{opacity: 0}, {opacity: 1, offset: .1}, {opacity: .2, offset: .25}, {opacity: 1, offset: .35}, {opacity: 0}], 700);
      A(m, [{filter: 'brightness(1.8)'}, {filter: 'none'}], 500, 120);
      const sc = cellsOf(m, 'паруса'), num = numOf(m, 'паруса');
      for(let i = v - 1; i >= Math.max(0, v - 2); i--) swapIcon(sc[i], CELLS2.SAIL_X);
      setNum(num, Math.max(0, v - 2)); const b = rootBox(root, num); markAt(root, b.x + 26, b.cy, '−2');
      await vwait(600); bolt.remove();
    }
    await done(1200); return;
  }
  if(kind === 'current'){
    // both teams swap their ships
    const pairs = [[by('Индевор'), by('Летучий голландец')], [by('Чёрная жемчужина'), by('Месть королевы Анны')]];
    for(const [a, b] of pairs){ if(!a || !b) continue;
      const la = parseFloat(a.style.left), lb = parseFloat(b.style.left);
      A(a, [{translate: '0 0'}, {translate: `${(lb - la) / 2}px -24px`, offset: .5}, {translate: `${lb - la}px 0`}], 900, 0, 'ease-in-out');
      A(b, [{translate: '0 0'}, {translate: `${(la - lb) / 2}px 24px`, offset: .5}, {translate: `${la - lb}px 0`}], 900, 0, 'ease-in-out');
    }
    await vwait(950);
    for(const [a, b] of pairs){ if(!a || !b) continue; const la = a.style.left; a.style.left = b.style.left; b.style.left = la; a.getAnimations().filter(q => !(q instanceof CSSAnimation)).forEach(x => x.cancel()); b.getAnimations().filter(q => !(q instanceof CSSAnimation)).forEach(x => x.cancel()); }
    await done(400); return;
  }

  markAt(root, 1150, 70, c[3][0].toUpperCase() + c[3].slice(1));
  await done(2200);
}

  guns.forEach((gx, i) => setTimeout(() => { const ang = Math.atan2(T.y - S.y, T.x - gx);
    gunFire(svg, gx, S.y - 4, ang, 1.05, {puffs: 11, life: 6400});
    A(pearl, [{translate: '0 0'}, {translate: `0 ${S.dir < 0 ? 6 : -6}px`, offset: .15}, {translate: '0 0'}], 420, 0, 'ease-out');
    boom(root, 4 - i, 260); flashRoot(root, '#ffcf8a', .12, 200); }, i * 150 / speed));
  await vwait(220);
  // 4. three cannonballs: each with its shadow on the sea; two fall short in spouts of water, the third hits a plank of the Hull
  const hullCells = cellsOf(dutch, 'корпус'), hv = parseInt(numOf(dutch, 'корпус').textContent, 10), hitCell = hullCells[hv - 1];
  const hb = rootBox(root, hitCell);
  const shots = [
    {x0: guns[0], to: [S.x + (T.x - S.x) * .38 - 30, S.y + (T.y - S.y) * .42], tag: 'Буря −1', d: 640, ric: true},
    {x0: guns[1], to: [S.x + (T.x - S.x) * .55 + 10, S.y + (T.y - S.y) * .6], tag: 'Диагональ −1', d: 700, delay: 140},
    {x0: guns[2], to: [hb.cx, hb.cy], hit: true, d: 820, delay: 280},
  ];
  await Promise.all(shots.map(sh => (async () => {
    await vwait(sh.delay || 0);
    const [x1, y1] = sh.to, x0 = sh.x0, y0 = S.y - 6, lift = sh.hit ? 26 : 18;
    if(sh.ric){ await ricochet(svg, x0, y0, x1, y1, sh.d + 300); }
    else await ballFly(svg, x0, y0, x1, y1, sh.d, lift);
    if(!sh.hit){
      if(!sh.ric) missSplash(svg, x1, y1, 1);
      const tg = sv(svg, `<g transform="translate(${R1(x1 + 6)} ${R1(y1 + 24)})">${TAG(sh.tag)}</g>`);
      A(tg, [{opacity: 0, transform: 'translateY(8px)'}, {opacity: 1, transform: 'none'}], 280, 200);
      return;
    }
    // the hit: a flash, a ring, splinters; the plank breaks off, falls into the sea and stays there afloat
    flashRoot(root, '#fff6d8', .38, 240); hitBlast(svg, hb.cx, hb.cy, 1.1, root);
    A(dutch, [{scale: '1'}, {scale: '1.025', offset: .15}, {scale: '1'}], 360, 0, 'ease-out'); shakeEl(dutch, 8, 480); boom(root, 6, 420);
    const fall = document.createElement('div'); fall.style.cssText = `position:absolute;left:${hb.x}px;top:${hb.y}px;width:${hb.w}px;height:${hb.h}px;z-index:9;pointer-events:none;line-height:0`;
    fall.innerHTML = hitCell.outerHTML; root.appendChild(fall);
    swapIcon(hitCell, CELLS2.HULL_X);
    const num = numOf(dutch, 'корпус'); num.textContent = `${hv - 1}/11`; num.style.color = '#a3271d';
    const pill = document.createElement('span'); pill.setAttribute('style', "margin-left:6px;padding:0 9px;border-radius:10px;background:#a3271d;color:#fff;font-family:'Old Standard TT',serif;font-weight:700;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.35)"); pill.textContent = '−1'; num.after(pill);
    A(pill, [{opacity: 0, transform: 'scale(.4)'}, {opacity: 1, transform: 'scale(1.3)', offset: .4}, {opacity: 1, transform: 'scale(1)'}], 380);
    const [sx, sy] = toSea(root, hb.cx + 40, T.y + 34);
    A(fall, [{transform: 'translate(0,0) rotate(0)'}, {transform: 'translate(12px,-16px) rotate(40deg)', offset: .2}, {transform: `translate(${R1(sx - (hb.x - rootBox(root, inner).x) - 6)}px,${R1(sy - (hb.y - rootBox(root, inner).y))}px) rotate(170deg)`}], 1000, 0, 'cubic-bezier(.3,.1,.7,1)');
    await vwait(1000); fall.remove();
    const ibx = rootBox(root, inner);
    waterColumn(svg, ibx.x + sx, ibx.y + sy, 22);
    // the wreckage stays afloat by the target and rocks with the sea
    sv(seaL, `<g transform="translate(${R1(sx)} ${R1(sy)}) scale(1.4)"><g><animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="3.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 2;0 0" dur="2.4s" additive="sum" repeatCount="indefinite"/>
      <ellipse cx="0" cy="3" rx="13" ry="3" fill="none" stroke="#e6f2f4" stroke-width="1" opacity=".7"/><rect x="-9" y="-2.6" width="18" height="5.2" rx="1" fill="#a8703a" stroke="#3a2412" stroke-width=".7"/><path d="M-6 -2.6 V2.6 M3 -2.6 V2.6" stroke="#6b4422" stroke-width=".6"/><path d="M9 -2.6 l2 1 l-2 1.2 l2 1.4" fill="none" stroke="#3a2412" stroke-width=".6"/></g></g>`);
    VS.pill = pill; VS.num = num;
  })()));
  await vwait(1900);
  // 5. the marks go, the smoke drifts away, the result stays: the broken plank, 7/11, the wreckage in the sea
  [...svg.childNodes].forEach(n => A(n, [{opacity: 1}, {opacity: 0}], 600));
  A(plate, [{opacity: 1}, {opacity: 0}], 450); A(seal, [{opacity: 1}, {opacity: 0}], 450);
  await vwait(620);
  svg.remove(); plate.remove(); seal.remove();
  if(VS.num) VS.num.style.color = ''; if(VS.pill) VS.pill.remove();
  dutch.style.boxShadow = '';
  if(yadra) yadra.remove();
  if(ribbon){ ribbon.textContent = '«Жемчужина» → «Голландец»: 1 по Корпусу'; ribbon.getAnimations().filter(q => !(q instanceof CSSAnimation)).forEach(a => a.cancel()); A(ribbon, [{opacity: 0}, {opacity: 1}], 300); }
  instr.textContent = '«Жемчужина»: карта или «Ход окончен»';
  if(VB){ VB.style.opacity = '.45'; VB.title = 'Залп уже был в этот ход'; }
  VS = null; paused = false; skip = false; speed = 1; undoable = true; ctlState();
}

/* ===== 4. the other clips of the game, in the A5 manner ===== */
function setRibbon(rb, text){ rb.textContent = text; rb.style.visibility = 'visible'; rb.style.width = 'auto'; rb.style.padding = '0 30px'; rb.style.whiteSpace = 'nowrap';
  const w = rb.offsetWidth; rb.style.left = Math.round(511 - w / 2) + 'px'; }
function soulsSet(m, f){ const w = document.createTreeWalker(m, NodeFilter.SHOW_TEXT); let n; while((n = w.nextNode())){ const mm = n.textContent.match(/(\d+)\s*\/\s*5/); if(mm && /Души/.test(n.parentNode.textContent)){ n.textContent = n.textContent.replace(/(\d+)(\s*\/\s*5)/, (_, a, b2) => Math.max(0, Math.min(5, f(+a))) + b2); return; } } }
const FXQ = [];   // effects clicked while another plays wait their turn and stack on the same table
async function runFx(kind){
  if(VS){ FXQ.push(kind); return; }
  const root = stage.querySelector(':scope > div'); if(!root) return;
  VS = {anims: []}; skip = false; paused = false; speed = 1; ctlState(); if(sel) unselect();
  const instr = root.querySelector('[data-pg="instr"]'), ribbon = root.querySelector('[data-pg="ribbon"]');
  const svg = layerSvg(root, 9), inner = seaInnerOf(root);
  const say = t => { if(instr) instr.textContent = t; };
  const done = async (ms, last) => { await vwait(ms); [...svg.childNodes].forEach(n => A(n, [{opacity: 1}, {opacity: 0}], 400)); await vwait(420); svg.remove(); if(ribbon && last){ setRibbon(ribbon, last); }
    VS.anims.forEach(a => { const t = a.effect && a.effect.target; if(t && t.nodeType === 1 && (t.classList.contains('mat') || t.matches('[data-pg="board"]') || t === root) && a.playState === 'finished') a.cancel(); });
    VS = null; paused = false; skip = false; speed = 1; ctlState(); if(FXQ.length) setTimeout(() => runFx(FXQ.shift()), 250); };
  const M = k => matOf(root, NAMES[k]);
  if(kind === 'endturn'){ say('Конец хода: дым, чернила и следы рассеиваются'); clearScars(root, 'turn'); await done(1900, 'Конец хода — следы хода убраны'); return; }
  if(kind === 'fire'){
    say('Ход Компании: «Индевор» горит — Пожар ×2');
    await fxFire(root); await done(300, '«Индевор»: Пожар ×2 — −2 Корпус'); return;
  }
  if(kind === 'repair'){
    // «Душа → Корпус» ×2: the soul flies out of the skull, new planks are nailed on with a hammer
    say('«Голландец»: Души → Корпус');
    clearScars(root, 'state', 'Г');   // repaired: the cracks and scorch of this ship go away
    const m = M('Г'), hc = cellsOf(m, 'корпус'), num = numOf(m, 'корпус'), v = parseInt(num.textContent, 10);
    const skull = [...m.querySelectorAll('svg')].find(s => s.closest('.mh') == null && s.parentNode.textContent.includes('Души'));
    const sb = skull ? rootBox(root, skull) : rootBox(root, m);
    for(let k = 0; k < 2; k++){
      const cell = hc[v + k]; if(!cell) break; const cb = rootBox(root, cell);
      const w = sv(svg, `<g><circle r="7" fill="#7ff0b0" opacity=".35"/><circle r="3.4" fill="#d6ffe6"/></g>`).firstChild;
      A(w, qpts(sb.cx, sb.cy, (sb.cx + cb.cx) / 2, Math.min(sb.cy, cb.cy) - 50, cb.cx, cb.cy, 16).map(([x, y]) => ({transform: `translate(${R1(x)}px,${R1(y)}px)`})), 700, 0, 'ease-in-out');
      await vwait(700); w.remove();
      const plank = document.createElement('div'); plank.className = 'pg-keg-fly'; plank.innerHTML = CELLS2.HULL.replace('width="12" height="16"', `width="${R1(cb.w)}" height="${R1(cb.h)}"`); root.appendChild(plank);
      A(plank, [{transform: `translate(${cb.x}px,${cb.y - 30}px) rotate(-30deg)`, opacity: 0}, {transform: `translate(${cb.x}px,${cb.y}px) rotate(0)`, opacity: 1}], 300, 0, 'cubic-bezier(.3,1.4,.6,1)');
      const ham = sv(svg, `<g><rect x="-2" y="0" width="4" height="22" rx="1.4" fill="#8a5a32" stroke="#22190f" stroke-width=".7"/><rect x="-9" y="-5" width="18" height="7" rx="1.4" fill="#6f6a66" stroke="#22190f" stroke-width=".8"/><path d="M-8 -4 H8" stroke="#b9b3ad" stroke-width="1"/></g>`).firstChild;
      for(let h = 0; h < 2; h++) A(ham, [{transform: `translate(${cb.cx + 14}px,${cb.y - 18}px) rotate(40deg)`}, {transform: `translate(${cb.cx + 8}px,${cb.y - 6}px) rotate(-30deg)`, offset: .5}, {transform: `translate(${cb.cx + 14}px,${cb.y - 18}px) rotate(40deg)`}], 300, 300 + h * 300);
      await vwait(450); sparks(svg, cb.cx, cb.y, 6, ['#fff3c4', '#e0bd62']); await vwait(300); sparks(svg, cb.cx, cb.y + 4, 6, ['#fff3c4', '#e0bd62']);
      await vwait(300); plank.remove(); ham.remove(); const n2 = swapIcon(cell, CELLS2.HULL); A(n2, [{filter: 'brightness(1.6) drop-shadow(0 0 4px #ffd27a)'}, {filter: 'none'}], 900);
      setNum(num, v + k + 1); const nb = rootBox(root, num); markAt(root, nb.x + 24, nb.y - 13, '+1 Корпус', true);
    }
    await done(600, '«Голландец»: −2 Души, +2 Корпус'); return;
  }
  if(kind === 'swap'){
    say('Пираты: Перестроение');
    await fxSwap(root, ['Ж', 'М']); await done(300, 'Пираты: Перестроение (бесплатно)'); return;
  }
  if(kind === 'dive' || kind === 'surface'){
    const m = M('Г'), b = rootBox(root, m), f = facing(root, m);
    if(kind === 'dive'){
      say('«Голландец» уходит под воду');
      A(m, [{transform: m.style.transform}, {transform: 'rotate(.25deg) translateY(2px) rotate(1.4deg)', offset: .3}, {transform: m.style.transform}], 900);
      for(let i = 0; i < 3; i++) ring(svg, b.cx, f.y + 18, 20, 220 - i * 30, '#cfe8ef', 1300, i * 250, 2.2);
      underWater(m);
      const veil = m.querySelector('.pg-sea-veil'); if(veil) A(veil, [{clipPath: 'inset(100% 0 0 0)'}, {clipPath: 'inset(0 0 0 0)'}], 1300, 200, 'ease-in');
      for(let i = 0; i < 16; i++){ const x = b.x + rnd(20, b.w - 20), c = sv(svg, `<circle r="${R1(rnd(2, 5))}" fill="rgba(220,244,248,.2)" stroke="#dff4f8" stroke-width="1"/>`).firstChild; A(c, [{transform: `translate(${R1(x)}px,${b.y + b.h}px)`, opacity: 0}, {opacity: 1, offset: .2}, {transform: `translate(${R1(x + rnd(-10, 10))}px,${R1(b.y - rnd(10, 40))}px)`, opacity: 0}], rnd(1000, 1700), rnd(200, 1300)); }
      await done(1800, '«Голландец» под водой: нельзя выбрать целью'); return;
    }
    say('«Голландец» всплывает: первый Залп +1, без Реакций');
    underWater(m); const veil = m.querySelector('.pg-sea-veil');
    await vwait(300);
    if(veil) A(veil, [{clipPath: 'inset(0 0 0 0)'}, {clipPath: 'inset(0 0 100% 0)'}], 1000, 0, 'ease-in');
    A(m, [{transform: m.style.transform}, {transform: 'rotate(.25deg) translateY(-8px)', offset: .5}, {transform: m.style.transform}], 1200, 0, 'cubic-bezier(.2,.8,.3,1.2)');
    for(let i = 0; i < 24; i++){ const x = b.x + rnd(10, b.w - 10), c = sv(svg, `<path d="M0 0 v${R1(rnd(6, 14))}" stroke="#bfe0ea" stroke-width="1.4" stroke-linecap="round"/>`).firstChild; A(c, [{transform: `translate(${R1(x)}px,${R1(b.y + rnd(0, 20))}px)`, opacity: 1}, {transform: `translate(${R1(x)}px,${R1(b.y + b.h + rnd(10, 30))}px)`, opacity: 0}], rnd(600, 1000), rnd(300, 900), 'ease-in'); }
    waterColumn(svg, b.x + 40, f.y + 10, 40); waterColumn(svg, b.x + b.w - 40, f.y + 10, 34);
    await vwait(1300); m.classList.remove('pg-under', 'pg-under-deep'); veil && veil.remove(); m.querySelectorAll('.pg-sea-veil').forEach(e => e.remove());
    A(m, [{boxShadow: '0 0 0 3px #7fd59a,0 0 24px rgba(127,213,154,.8),0 12px 20px rgba(0,0,0,.45)'}, {boxShadow: '0 0 0 2px #9cc4d4,0 1px 0 #c9b48c,0 12px 20px rgba(0,0,0,.45)'}], 1200);
    m.classList.add('pg-surf');
    await done(800, '«Голландец» всплыл'); return;
  }
  if(kind === 'sink'){ say('«Месть королевы Анны» тонет'); await fxSink(root, 'М', 'Ж'); await done(400, '«Месть» потоплена — капитан на борту «Жемчужины»'); return; }
  if(kind === 'souls'){
    // a hit to the Crew: a green wisp of a soul goes from the enemy to the skull of «Голландец»
    say('«Голландец» забирает Душу');
    const from = M('Ж'), m = M('Г'); const cr = cellsOf(from, 'команда'), fb = rootBox(root, cr[cr.length - 1]);
    const skull = [...m.querySelectorAll('svg')].find(s => s.parentNode.textContent.includes('Души')); const sb = rootBox(root, skull);
    // the soul leaves the sailor as a green wisp with a tail of sparks, curls over the sea, goes into the skull
    const path = qpts(fb.cx, fb.cy, (fb.cx + sb.cx) / 2 - 160, Math.min(fb.cy, sb.cy) + 60, sb.cx, sb.cy, 40);
    const glow = sv(svg, `<g><circle r="18" fill="#7ff0b0" opacity=".22"/><circle r="9" fill="#a8ffcc" opacity=".6"/><circle r="4.4" fill="#effff4"/><circle cx="-3" cy="-2" r="1.2" fill="#0f3a24"/><circle cx="3" cy="-2" r="1.2" fill="#0f3a24"/></g>`).firstChild;
    A(glow, path.map(([x, y]) => ({transform: `translate(${R1(x)}px,${R1(y)}px)`})), 1700, 0, 'ease-in-out');
    for(let k = 1; k <= 8; k++){ const t = sv(svg, `<circle r="${R1(4 - k * .35)}" fill="#a8ffcc"/>`).firstChild; A(t, path.map(([x, y]) => ({transform: `translate(${R1(x)}px,${R1(y)}px)`, opacity: R1(.8 - k * .08)})), 1700, k * 45, 'ease-in-out'); }
    const cell = cr[cr.length - 1]; A(cell, [{filter: 'none'}, {filter: 'drop-shadow(0 0 6px #7ff0b0) brightness(1.5)', offset: .3}, {filter: 'grayscale(1) brightness(.8)'}], 900);
    await vwait(1750); glow.remove();
    ring(svg, sb.cx, sb.cy, 3, 30, '#7ff0b0', 700, 0, 2.4); sparks(svg, sb.cx, sb.cy, 14, ['#effff4', '#a8ffcc', '#7ff0b0']); A(skull, [{filter: 'drop-shadow(0 0 0 #7ff0b0)', transform: 'scale(1)'}, {filter: 'drop-shadow(0 0 8px #7ff0b0) brightness(1.4)', transform: 'scale(1.5)', offset: .4}, {filter: 'none', transform: 'scale(1)'}], 900);
    soulsSet(m, n => n + 1);
    markAt(root, sb.cx + 10, sb.y - 14, '+1 Душа', true);
    await done(800, '«Голландец»: +1 Душа'); return;
  }
  if(kind === 'kraken'){ say('«Голландец» зовёт Кракена'); await fxKraken(root); await done(400, '«Голландец»: Кракен — −4 Корпус, −2 Команды «Жемчужине»'); return; }
  if(kind === 'armada'){ say('«Индевор»: Армада Компании'); await fxArmada(root); await done(400, '«Индевор»: Армада — −2 Корпус, −1 Парус всем пиратам'); return; }
  if(kind === 'bottle'){ say('«Месть»: Корабль в бутылке'); await fxBottle(root); await done(400, '«Месть»: «Индевор» в бутылке — потоплен'); return; }
  if(kind === 'jack'){ say('«Жемчужина» должна утонуть… «Джек ускользает»!'); await fxJack(root); await done(400, '«Джек ускользает»: Корпус 2, пираты поменялись местами'); return; }
  await done(200);
}
