<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Стартовый экран</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&amp;family=Alegreya+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f2c14e}a:hover{color:#ffe3a0}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes rockL{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-4px) rotate(1deg)}}
@keyframes rockR{0%,100%{transform:translateY(-3px) rotate(1.5deg)}50%{transform:translateY(1px) rotate(-1deg)}}
@keyframes puff{0%{opacity:0;transform:scale(.4)}15%{opacity:.9}100%{opacity:0;transform:scale(1.8) translateX(10px)}}
.waves{animation:drift 12s linear infinite}
.shipL{animation:rockL 4s ease-in-out infinite;transform-origin:50% 90%}
.shipR{animation:rockR 4.6s ease-in-out infinite;transform-origin:50% 90%}
.puff{animation:puff 3.2s ease-out infinite;transform-origin:center}
.puff2{animation:puff 3.2s ease-out 1.6s infinite;transform-origin:center}
@media (prefers-reduced-motion:reduce){.waves,.shipL,.shipR,.puff,.puff2{animation:none}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#13283a;font-family:'Alegreya Sans',sans-serif;color:#f5ecd9">
  <!-- the scene: dusk bands, a moon, two ships broadside to broadside -->
  <svg aria-hidden="true" width="390" height="430" viewBox="0 0 390 430" style="position:absolute;left:0;top:0">
    <rect width="390" height="430" fill="#13283a"></rect>
    <rect y="170" width="390" height="90" fill="#1d3a50"></rect>
    <rect y="240" width="390" height="60" fill="#2a4e63"></rect>
    <circle cx="300" cy="90" r="34" fill="#f3e2b3"></circle>
    <circle cx="314" cy="80" r="30" fill="#13283a"></circle>
    <g fill="#f5ecd9" opacity=".7"><circle cx="40" cy="50" r="1.4"></circle><circle cx="90" cy="110" r="1"></circle><circle cx="170" cy="40" r="1.3"></circle><circle cx="230" cy="130" r="1"></circle><circle cx="355" cy="160" r="1.2"></circle><circle cx="20" cy="150" r="1"></circle></g>
    <rect y="300" width="390" height="130" fill="#1b4a5a"></rect>
  </svg>
  <svg class="waves" aria-hidden="true" width="780" height="140" viewBox="0 0 780 140" style="position:absolute;left:0;top:296px">
    <g fill="none" stroke="#7fb3bf" stroke-width="2" stroke-linecap="round" opacity=".55">
      <path d="M0 20 q20-10 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"></path>
      <path d="M0 70 q25-12 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0"></path>
      <path d="M0 115 q20-10 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"></path>
    </g>
  </svg>
  <!-- left ship (pirates, dark sails), right ship (the Company, gold) -->
  <svg class="shipL" aria-hidden="true" width="150" height="150" viewBox="0 0 150 150" style="position:absolute;left:18px;top:178px">
    <path d="M10 112h130l-18 26H28z" fill="#26221F"></path>
    <path d="M18 104h112l-4 10H22z" fill="#3a332c"></path>
    <path d="M48 104V20M82 104V8M114 104V30" stroke="#26221F" stroke-width="4"></path>
    <path d="M52 26c22 6 28 26 26 52H52zM86 14c24 6 32 30 28 64H86zM117 36c14 6 18 20 16 40h-16z" fill="#3b3631"></path>
    <path d="M82 8l-14 6 14 4z" fill="#8A2E1C"></path>
    <g fill="#f2c14e"><circle cx="40" cy="118" r="2.5"></circle><circle cx="64" cy="118" r="2.5"></circle><circle cx="88" cy="118" r="2.5"></circle><circle cx="112" cy="118" r="2.5"></circle></g>
  </svg>
  <svg class="shipR" aria-hidden="true" width="150" height="150" viewBox="0 0 150 150" style="position:absolute;right:16px;top:186px;transform-box:fill-box">
    <g transform="translate(150 0) scale(-1 1)">
      <path d="M10 112h130l-18 26H28z" fill="#5d4720"></path>
      <path d="M18 104h112l-4 10H22z" fill="#9C7A2C"></path>
      <path d="M48 104V20M82 104V8M114 104V30" stroke="#4a3818" stroke-width="4"></path>
      <path d="M52 26c22 6 28 26 26 52H52zM86 14c24 6 32 30 28 64H86zM117 36c14 6 18 20 16 40h-16z" fill="#efe2c4"></path>
      <path d="M82 8l-14 6 14 4z" fill="#2C6658"></path>
      <g fill="#13283a"><circle cx="40" cy="118" r="2.5"></circle><circle cx="64" cy="118" r="2.5"></circle><circle cx="88" cy="118" r="2.5"></circle><circle cx="112" cy="118" r="2.5"></circle></g>
    </g>
  </svg>
  <svg aria-hidden="true" width="390" height="430" viewBox="0 0 390 430" style="position:absolute;left:0;top:0">
    <circle class="puff" cx="168" cy="296" r="14" fill="#e9e2d4"></circle>
    <circle class="puff2" cx="222" cy="300" r="12" fill="#e9e2d4"></circle>
  </svg>

  <!-- the title -->
  <div style="position:absolute;left:0;right:0;top:44px;text-align:center">
    <div style="font-family:Alegreya,serif;font-weight:800;font-size:44px;line-height:1;color:#f5ecd9;letter-spacing:.01em">Бортом к борту</div>
    <div style="margin-top:8px;font-size:15px;color:#c9d9df">Пираты против Компании</div>
  </div>

  <!-- the modes -->
  <div style="position:absolute;left:16px;right:16px;top:446px;display:flex;flex-direction:column;gap:12px">
    <button type="button" style="display:flex;align-items:center;gap:14px;min-height:72px;padding:12px 16px;border-radius:16px;border:0;background:#f2c14e;color:#2a241d;font:inherit;text-align:left">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2a241d" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="8" width="14" height="11" rx="3"></rect><path d="M12 8V4M9 13h.01M15 13h.01M9 16h6"></path></svg>
      <span style="display:flex;flex-direction:column"><b style="font-family:Alegreya,serif;font-size:21px">Против ботов</b><span style="font-size:14px">Вы — одна команда, боты — другая</span></span>
    </button>
    <button type="button" style="display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 16px;border-radius:16px;border:2px solid #f5ecd9;background:transparent;color:#f5ecd9;font:inherit;text-align:left">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#f5ecd9" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"></path></svg>
      <span style="display:flex;flex-direction:column"><b style="font-family:Alegreya,serif;font-size:19px">По сети</b><span style="font-size:14px;color:#c9d9df">Каждый со своего телефона</span></span>
    </button>
    <button type="button" style="display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 16px;border-radius:16px;border:2px solid #f5ecd9;background:transparent;color:#f5ecd9;font:inherit;text-align:left">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#f5ecd9" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"></circle><circle cx="16" cy="8" r="3"></circle><path d="M2 20c0-4 3-6 6-6s6 2 6 6M14 14c3 0 8 1 8 6"></path></svg>
      <span style="display:flex;flex-direction:column"><b style="font-family:Alegreya,serif;font-size:19px">Вдвоём на одном экране</b><span style="font-size:14px;color:#c9d9df">Передаёте устройство друг другу</span></span>
    </button>
  </div>
  <div style="position:absolute;left:16px;right:16px;bottom:28px;display:flex;justify-content:space-between;font-size:15px">
    <a href="#">Правила</a><a href="#">Все карты</a><a href="#">Матч ботов</a><a href="#">Настройки</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
