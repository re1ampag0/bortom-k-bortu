<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Залп: гнездо для ядра и звук</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&amp;family=Alegreya+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A2E1C}a:hover{color:#5c1e12}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px) rotate(-.6deg)}40%{transform:translate(5px,-4px) rotate(.5deg)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
@keyframes pop{0%{transform:translateY(0) scale(.6);opacity:0}30%{transform:translateY(-14px) scale(1.25);opacity:1}100%{transform:translateY(-40px) scale(1);opacity:0}}
@keyframes glowball{0%,100%{box-shadow:0 0 0 0 rgba(255,140,40,.7)}50%{box-shadow:0 0 16px 6px rgba(255,140,40,.6)}}
.shake{animation:shake .45s ease-out}
.pop{animation:pop 1.1s ease-out forwards}
.hot{animation:glowball 1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.shake,.pop,.hot{animation:none}}
</style>
</helmet>
<div class="{{shakeClass}}" style="width:880px;height:560px;box-sizing:border-box;padding:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;background:#2a5866;font-family:'Alegreya Sans',sans-serif;color:#2a241d">

  <!-- left: the cannon with its socket, the charge chosen by a press -->
  <div style="display:flex;flex-direction:column;gap:14px;background:#fffaf2;border-radius:18px;padding:18px">
    <div style="font-family:Alegreya,serif;font-weight:800;font-size:22px">Залп «Жемчужины» по «Индевору»</div>
    <div style="display:flex;align-items:center;gap:16px">
      <svg width="170" height="96" viewBox="0 0 170 96" aria-hidden="true">
        <rect x="18" y="28" width="118" height="34" rx="16" fill="#33302c" transform="rotate(-8 77 45)"></rect>
        <rect x="128" y="22" width="18" height="40" rx="6" fill="#4a453f" transform="rotate(-8 137 42)"></rect>
        <circle cx="52" cy="72" r="20" fill="#6b4a2f" stroke="#3d2a1a" stroke-width="4"></circle>
        <circle cx="52" cy="72" r="5" fill="#3d2a1a"></circle>
        <path d="M14 92h120" stroke="#6b4a2f" stroke-width="6" stroke-linecap="round"></path>
      </svg>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div class="{{ballClass}}" style="width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:{{ballBg}};border:3px dashed #b8902e;color:#fff;font-weight:800;font-size:16px">{{ballText}}</div>
        <span style="font-size:13px;font-weight:700;color:#6b6157">{{ballLabel}}</span>
      </div>
    </div>
    <div style="font-size:13px;font-weight:700;color:#6b6157">Заряд — нажмите, чтобы зарядить:</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <sc-for list="{{charges}}" as="c" hint-placeholder-count="3">
        <button type="button" onClick="{{c.pick}}" style="{{c.style}}">
          <span style="width:22px;height:22px;border-radius:50%;background:{{c.dot}};display:inline-block"></span>
          <span style="display:flex;flex-direction:column;text-align:left"><b style="font-size:14px">{{c.name}}</b><span style="font-size:12px;color:#a3341f;font-weight:700">{{c.big}}</span></span>
        </button>
      </sc-for>
    </div>
    <div style="margin-top:auto;display:flex;gap:10px">
      <button type="button" onClick="{{fire}}" style="flex:1;height:54px;border-radius:14px;border:0;background:#2a241d;color:#fff;font-family:Alegreya,serif;font-weight:800;font-size:20px">Огонь! · 1 Порох</button>
    </div>
  </div>

  <!-- right: the breakdown counts up like a drum; the target takes the hit; the sounds -->
  <div style="display:flex;flex-direction:column;gap:14px">
    <div style="background:#fffaf2;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;font-size:16px">
      <div style="display:flex;justify-content:space-between"><span>3 Пушки</span><b>3</b></div>
      <div style="display:flex;justify-content:space-between;color:#a3341f"><span>{{chargeLine}}</span><b>{{chargePlus}}</b></div>
      <div style="display:flex;justify-content:space-between;color:#2d5d7b"><span>Буря</span><b>−1</b></div>
      <div style="height:1px;background:#d9cfbf;margin:4px 0"></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-weight:700">по Корпусу</span><b style="font-family:Alegreya,serif;font-size:44px;color:#a3341f;line-height:1">{{shown}}</b></div>
    </div>
    <div style="position:relative;background:#fffaf2;border-radius:18px;overflow:visible">
      <div style="padding:8px 14px;background:#9C7A2C;color:#fff;font-family:Alegreya,serif;font-weight:700;font-size:18px;border-radius:18px 18px 0 0">«Индевор»</div>
      <div style="display:flex;align-items:center;gap:12px;padding:12px 14px">
        <div style="position:relative;width:52px;height:58px;display:grid;place-items:center"><svg width="52" height="58" viewBox="0 0 40 44" aria-hidden="true" style="position:absolute;inset:0"><path d="M20 2l16 6v12c0 11-7 18-16 22C11 38 4 31 4 20V8z" fill="#a3341f"></path></svg><span style="position:relative;color:#fff;font-weight:700;font-size:22px">{{hull}}</span></div>
        <span style="font-weight:700">Корпус</span>
        <sc-if value="{{hitShown}}" hint-placeholder-val="{{false}}">
          <span class="pop" style="position:absolute;left:44px;top:30px;font-family:Alegreya,serif;font-weight:800;font-size:34px;color:#e0473a">−{{total}}</span>
        </sc-if>
      </div>
    </div>
    <div style="background:#203f4a;border-radius:18px;padding:12px 14px;color:#e4eef0;display:flex;flex-direction:column;gap:8px">
      <b style="font-size:14px">Звуки (свои, синтезированные — без записей)</b>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px">
        <button type="button" onClick="{{sCannon}}" style="min-height:40px;border-radius:10px;border:1.5px solid #9cc6cf;background:transparent;color:#e4eef0;font:inherit;font-weight:700">Выстрел</button>
        <button type="button" onClick="{{sSplash}}" style="min-height:40px;border-radius:10px;border:1.5px solid #9cc6cf;background:transparent;color:#e4eef0;font:inherit;font-weight:700">Всплеск</button>
        <button type="button" onClick="{{sCreak}}" style="min-height:40px;border-radius:10px;border:1.5px solid #9cc6cf;background:transparent;color:#e4eef0;font:inherit;font-weight:700">Доски</button>
        <button type="button" onClick="{{sCard}}" style="min-height:40px;border-radius:10px;border:1.5px solid #9cc6cf;background:transparent;color:#e4eef0;font:inherit;font-weight:700">Карта</button>
        <button type="button" onClick="{{sBell}}" style="min-height:40px;border-radius:10px;border:1.5px solid #9cc6cf;background:transparent;color:#e4eef0;font:inherit;font-weight:700">Рында</button>
        <button type="button" onClick="{{sSea}}" style="min-height:40px;border-radius:10px;border:1.5px solid #9cc6cf;background:{{seaBg}};color:#e4eef0;font:inherit;font-weight:700">{{seaLabel}}</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":560}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { charge: 0, shown: 3, hull: 12, firing: false, hit: false, sea: false };
  }
  ac() {
    if (!this._ac) { const C = window.AudioContext || window.webkitAudioContext; this._ac = new C(); }
    if (this._ac.state === 'suspended') this._ac.resume();
    return this._ac;
  }
  noise(sec) {
    const a = this.ac(), n = Math.floor(a.sampleRate * sec), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(); s.buffer = b; return s;
  }
  env(g, t0, peak, dur) { g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); }
  cannon() {
    const a = this.ac(), t = a.currentTime;
    const src = this.noise(1.2), lp = a.createBiquadFilter(), g = a.createGain();
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(1800, t); lp.frequency.exponentialRampToValueAtTime(180, t + 0.6);
    this.env(g, t, 0.9, 1.1); src.connect(lp).connect(g).connect(a.destination); src.start(t);
    const o = a.createOscillator(), og = a.createGain();
    o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.5);
    this.env(og, t, 0.8, 0.6); o.connect(og).connect(a.destination); o.start(t); o.stop(t + 0.7);
  }
  splash() {
    const a = this.ac(), t = a.currentTime;
    const src = this.noise(0.9), bp = a.createBiquadFilter(), g = a.createGain();
    bp.type = 'bandpass'; bp.frequency.setValueAtTime(900, t); bp.frequency.linearRampToValueAtTime(2600, t + 0.15); bp.frequency.linearRampToValueAtTime(600, t + 0.8); bp.Q.value = 0.8;
    this.env(g, t, 0.5, 0.85); src.connect(bp).connect(g).connect(a.destination); src.start(t);
  }
  creak() {
    const a = this.ac(), t = a.currentTime, o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(120, t); o.frequency.linearRampToValueAtTime(170, t + 0.25); o.frequency.linearRampToValueAtTime(110, t + 0.55);
    f.type = 'bandpass'; f.frequency.value = 700; f.Q.value = 6;
    this.env(g, t, 0.25, 0.6); o.connect(f).connect(g).connect(a.destination); o.start(t); o.stop(t + 0.65);
  }
  card() {
    const a = this.ac(), t = a.currentTime, src = this.noise(0.25), hp = a.createBiquadFilter(), g = a.createGain();
    hp.type = 'highpass'; hp.frequency.setValueAtTime(2500, t); hp.frequency.linearRampToValueAtTime(6000, t + 0.18);
    this.env(g, t, 0.3, 0.2); src.connect(hp).connect(g).connect(a.destination); src.start(t);
  }
  bell() {
    const a = this.ac(), t = a.currentTime;
    [880, 1320, 2210].forEach((fr, i) => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = fr; this.env(g, t, [0.35, 0.18, 0.08][i], 1.6); o.connect(g).connect(a.destination); o.start(t); o.stop(t + 1.7); });
  }
  seaToggle() {
    const a = this.ac();
    if (this._sea) { this._sea.stop(); this._sea = null; this.setState({ sea: false }); return; }
    const n = a.sampleRate * 4, b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
    let last = 0; for (let i = 0; i < n; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    const s = a.createBufferSource(), lp = a.createBiquadFilter(), g = a.createGain(), lfo = a.createOscillator(), lg = a.createGain();
    s.buffer = b; s.loop = true; lp.type = 'lowpass'; lp.frequency.value = 500; g.gain.value = 0.25;
    lfo.frequency.value = 0.12; lg.gain.value = 0.15; lfo.connect(lg).connect(g.gain); lfo.start();
    s.connect(lp).connect(g).connect(a.destination); s.start(); this._sea = s; this.setState({ sea: true });
  }
  componentWillUnmount() { if (this._sea) this._sea.stop(); clearInterval(this._iv); }
  renderVals() {
    const list = [
      { name: 'Обычное ядро', big: '+0', plus: 0, dot: '#33302c' },
      { name: 'Ядра', big: '+1 урон', plus: 1, dot: '#e0782a' },
      { name: 'Оплаченный залп', big: '+2 за Порох', plus: 2, dot: '#b8902e' },
    ];
    const cur = list[this.state.charge];
    const total = 3 + cur.plus - 1;
    const charges = list.map((c, i) => ({
      ...c,
      style: 'display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 12px;border-radius:12px;font:inherit;background:#fff;cursor:pointer;' + (i === this.state.charge ? 'border:2px solid #2a241d;box-shadow:0 0 0 3px #f2c14e' : 'border:1.5px solid #d9cfbf'),
      pick: () => { this.setState({ charge: i, shown: 3 + c.plus - 1, hull: 12, hit: false }); this.card(); },
    }));
    const fire = () => {
      clearInterval(this._iv);
      this.cannon();
      setTimeout(() => this.splash(), 380);
      let k = 0;
      this.setState({ firing: true, hit: false, shown: 0 });
      this._iv = setInterval(() => {
        k++;
        if (k >= total * 3) { clearInterval(this._iv); this.setState({ shown: total, hit: true, hull: 12 - total }); this.creak(); setTimeout(() => this.setState({ firing: false }), 450); return; }
        this.setState({ shown: Math.floor(Math.random() * 9) });
      }, 45);
    };
    return {
      charges, fire, total,
      shown: this.state.shown,
      hull: this.state.hull,
      hitShown: this.state.hit,
      shakeClass: this.state.firing && this.state.hit ? 'shake' : '',
      ballBg: cur.plus ? cur.dot : '#33302c',
      ballText: cur.plus ? '+' + cur.plus : '',
      ballLabel: cur.plus ? cur.name : 'Обычное ядро',
      ballClass: cur.plus ? 'hot' : '',
      chargeLine: cur.plus ? 'Заряд «' + cur.name + '»' : 'Без Заряда',
      chargePlus: cur.plus ? '+' + cur.plus : '0',
      sCannon: () => this.cannon(), sSplash: () => this.splash(), sCreak: () => this.creak(), sCard: () => this.card(), sBell: () => this.bell(), sSea: () => this.seaToggle(),
      seaLabel: this.state.sea ? 'Море: выкл' : 'Море: вкл',
      seaBg: this.state.sea ? '#2a5866' : 'transparent',
    };
  }
}
</script>
</body>
</html>
